        f.episodeStatus==='match'&&'<span class="chip-sm cached">Episode match</span>'].filter(Boolean).join('');
      const label=[isBest?'Recommended.':'',s.title,ev.label+'.',entry.why,s.addonName?'From '+s.addonName:''].filter(Boolean).join(' ');
      const details=[['Release',s.title],['Filename',f.filename],['Provider',s.addonName||s.sourceName],['Compatibility',ev.label],['Why',entry.why],['Quality',[f.resolution,f.codec,f.hdr].filter(Boolean).join(' · ')],['Audio',[...(f.audioLanguages||[]),f.audioCodec,f.audioChannels].filter(Boolean).join(' · ')],['Size',f.sizeText],['Delivery',s.kind.toUpperCase()],['Cached',f.cached?'Yes':''],['File index',s.fileIdx==null?'':String(s.fileIdx)],['Pack status',f.episodeStatus==='ambiguous-pack'?'Pack has no exact file selected':f.episodeStatus==='mismatch'?'Does not match selected episode':f.episodeStatus==='pack-file'?'Exact file selected from pack':f.pack?'Pack':''],['Binge group',s.bingeGroup]].filter(([,v])=>v);
      return `<article class="stream-card"><button class="stream-row ${isBest?'recommended':''} ${ev.playable?'':'blocked'}" data-play-source="${esc(candidateKey(entry))}" aria-label="${esc(label)}">
        ${isBest?'<span class="best-flag">Recommended</span>':''}
        <span class="stream-state ${ev.state}" aria-hidden="true"></span>
        <span class="stream-main"><span class="stream-title">${esc(s.title)}</span><span class="stream-why">${esc(entry.why)}</span><span class="stream-chips">${chips}</span></span>
        <span class="stream-side"><span class="chip-sm state-${ev.state}" title="${esc(ev.label)}">${esc(PB.streams.STATE_SHORT[ev.state]||ev.label)}</span><span class="stream-badge">${esc(s.kind.toUpperCase())}</span>${s.addonName?`<span class="stream-source">${esc(s.addonName)}</span>`:''}</span></button>
        <details class="stream-details"><summary>Full source details</summary><dl class="stream-details-grid">${details.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details></article>`;
    }

    /* ---- player shell --------------------------------------------------- */
    function openPlayer(entry){
      const m=state.currentMeta,v=state.currentVideo||m;
      if(!entry)return;
      const s=entry.stream;
      if(s.kind==='external'){const u=s.externalUrl;if(!u||!entry.evaluation||entry.evaluation.state==='unsafe')return toast('That external link is not safe to open.','bad');window.open(u,'_blank','noopener');return}
      if(s.kind==='torrent'){showTorrent(s);return}
      closePlayer(true);
      player.meta=m;player.video=v;
      const saved=videoProgress(m,v.id);
      const resumeTime=saved&&!saved.completed&&saved.duration&&saved.time<saved.duration*.93?saved.time:0;
      renderPlayerShell();
      // The tapped source always plays, even above the ceiling. Automatic
      // alternatives are filtered so failover cannot exceed it either.
      const ordered=[entry,...player.ranked.filter(e=>candidateKey(e)!==candidateKey(entry))];
      player.session=PB.engine.createSession({
        candidates:ordered.map((e,i)=>({id:candidateKey(e),stream:e.stream,evaluation:e.evaluation,entry:e,autoEligible:i===0||(!e.aboveCeiling&&e.autoEligible===true)})),
        settings:state.settings,resumeTime,
        onAttempt:startAttempt,onChange:renderPlayerState
      });
      player.session.start();
    }
    function renderPlayerShell(){
      const m=player.meta,v=player.video;
      $('#modalRoot').innerHTML=`<div class="modal-shell player-shell" id="playerShell"><section class="modal player-modal" role="dialog" aria-modal="true" aria-label="Player">
        <div class="player-top"><button class="icon-btn" data-close-player aria-label="Close player">${icon('close')}</button>
          <div class="player-title"><b id="playerHeading">${esc(v.title||v.name||m.name||'Playing')}</b><span id="playerSubheading"></span>
          <span class="player-quality" id="playerQuality"></span></div></div>
        <div class="player-tools" id="playerTools"></div>
        <div class="player-stage" id="playerStage"><span class="spinner"></span></div>
        <div class="player-status" id="playerStatus"></div></section></div>`;
      bindDynamic($('#modalRoot'));
      armIdleHide();
    }
    function armIdleHide(){
      const shell=$('#playerShell');if(!shell)return;
      clearTimeout(player.idleTimer);shell.classList.remove('idle');
      player.idleTimer=setTimeout(()=>shell.classList.add('idle'),3600);
      shell.onpointerdown=()=>{clearTimeout(player.idleTimer);shell.classList.remove('idle');player.idleTimer=setTimeout(()=>shell.classList.add('idle'),3600)};
    }

    /* One playback attempt: build the media element, adapter and listeners.
       Everything allocated here belongs to this attempt's scope. */
    function startAttempt({attemptId,candidate,resumeTime}){
      teardownAttempt();
      const s=candidate.stream,m=player.meta,v=player.video,stage=$('#playerStage');
      if(!stage)return;
      const scope=PB.adapters.createResourceScope();player.scope=scope;
      const live=()=>player.session&&!player.session.cancelled&&player.session.snapshot().attemptId===attemptId;
      const report=(event,detail)=>{if(player.session&&live())player.session.report(attemptId,event,detail)};

      if(s.kind==='youtube'){
        stage.innerHTML=`<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="${esc(v.title||m.name||'Video')}" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(s.ytId)}?autoplay=1"></iframe>`;
        report('ready');return;
      }
      const audioOnly=s.facts.audioOnly||['music','radio'].includes(m.type);
      stage.innerHTML=audioOnly
        ?`<div class="audio-stage" style="background-image:url('${esc((backdrop(m)||'').replace(/'/g,'%27'))}')">${poster(m)?`<img src="${esc(poster(m))}" alt="">`:''}<audio id="mediaEl" controls autoplay></audio></div>`
        :'<video id="mediaEl" controls autoplay playsinline></video>';
      const el=$('#mediaEl');
      const caps=capsNow();
      const adapterKind=PB.adapters.adapterKindFor(s.kind,caps);

      scope.listen(el,'playing',()=>report('ready'));
      scope.listen(el,'loadedmetadata',()=>{
        if(resumeTime>0&&Number.isFinite(el.duration)&&resumeTime<el.duration*.93){try{el.currentTime=resumeTime}catch{}}
        report('ready');
      });
      let lastWrite=0;
      scope.listen(el,'timeupdate',()=>{
        report('progress',{currentTime:el.currentTime});
        if(Date.now()-lastWrite<4000||!Number.isFinite(el.duration))return;
        lastWrite=Date.now();progress.record(m,v,{time:el.currentTime,duration:el.duration});
      });
      scope.listen(el,'pause',()=>progress.flush());
      scope.listen(el,'ended',()=>{
        if(!Number.isFinite(el.duration))return;
        // Completion is only ever recorded from a real 'ended' event, never a failure.
        progress.record(m,v,{time:el.duration,duration:el.duration,completed:true,immediate:true});
        onEpisodeEnded();
      });

      // Load the pinned runtime first, then build the adapter exactly once.
      const needsLibrary=adapterKind==='hls'?loadHls():adapterKind==='dash'?loadDash():Promise.resolve();
      return needsLibrary
        .catch(e=>{const err=new Error(e&&e.message||'The playback library could not be loaded');err.playbackType='library';throw err})
        .then(()=>{
          if(!live()||scope.disposed)return;
          player.adapter=PB.adapters.createAdapter(adapterKind,{media:el,scope,url:s.url,Hls:window.Hls,dashjs:window.dashjs,onError:e=>report('error',e),onAudioTracksChanged:tracks=>{if(live()&&!scope.disposed)refreshAudioTracks(tracks)}});
          return player.adapter.attach();
        })
        .then(()=>{if(live()&&!scope.disposed)attachSubtitles(el,s,m,v,scope,live)});
    }
    function teardownAttempt(){
      if(player.adapter){try{player.adapter.destroy()}catch{}player.adapter=null}
      if(player.scope){try{player.scope.dispose()}catch{}player.scope=null}
      player.subtitleTracks=[];player.subtitleAttached=[];player.activeSubtitle=null;player.audioPreferenceApplied=false;player.menu=null;
    }

    function renderPlayerState(snap){
      const status=$('#playerStatus'),stage=$('#playerStage');
      if(!status||!stage)return;
      const sub=$('#playerSubheading'),quality=$('#playerQuality');
      const s=snap.candidate&&snap.candidate.stream;
      if(sub)sub.textContent=s?[s.addonName,PB.episodes.episodeCode(player.video)].filter(Boolean).join(' · '):'';
      if(quality)quality.innerHTML=s?[s.facts.resolution,s.facts.codec,s.facts.hdr,s.facts.cached?'Cached':''].filter(Boolean).map(t=>`<span class="chip-sm">${esc(t)}</span>`).join(''):'';

      if(snap.state==='starting'){
        stage.innerHTML=`<div class="player-loading"><span class="spinner"></span><b>Starting ${esc(s?s.title:'source')}</b><span>${esc(s&&s.addonName?s.addonName+' · ':'')}Attempt ${snap.attemptCount} of ${snap.maxAttempts}</span></div>`;
        if(snap.lastFailure){
          const failed=snap.lastFailure.candidate&&snap.lastFailure.candidate.stream;
          player.notice={failed:failed?failed.title:'The last source',text:snap.lastFailure.text,until:Date.now()+NOTICE_DWELL_MS};
          status.innerHTML=failoverNoticeHTML(player.notice,false);
        }else status.innerHTML='';
        renderTools(snap);return;
      }
      if(snap.state==='playing'){showSettledNotice(status);renderTools(snap);return}
      // Terminal: release the media element, library instance and listeners now
      // rather than waiting for a retry, a switch, or the viewer closing up.
      if(snap.state==='failed'||snap.state==='exhausted'){teardownAttempt();renderPlayerError(snap);renderTools(snap);return}
    }
    // A recovery that flashes past is not a recovery the viewer can understand,
    // so the notice outlives the switch by a readable minimum.
    const NOTICE_DWELL_MS=4000;
    function failoverNoticeHTML(notice,settled){
      return `<div class="status-card">${settled?icon('check'):'<span class="spinner"></span>'}<div><b>${settled?'Switched source':'Trying another source'}</b><span>${esc(notice.failed)} failed: ${esc(notice.text)}</span></div></div>`;
    }
    /** Hold the recovery message on screen briefly once playback starts. */
    function showSettledNotice(status){
      clearTimeout(player.noticeTimer);player.noticeTimer=null;
      const notice=player.notice;
      if(!notice){status.innerHTML='';return}
      const remaining=notice.until-Date.now();
      if(remaining<=0){player.notice=null;status.innerHTML='';return}
      status.innerHTML=failoverNoticeHTML(notice,true);
      player.noticeTimer=setTimeout(()=>{
        player.noticeTimer=null;player.notice=null;
        const el=$('#playerStatus');if(el)el.innerHTML='';
      },remaining);
    }
    function renderPlayerError(snap){
      const stage=$('#playerStage'),status=$('#playerStatus');
      const failure=snap.lastFailure,failed=failure&&failure.candidate&&failure.candidate.stream;
      stage.innerHTML=`<div class="player-error">
        <div class="error-kind">${esc(failure?failure.kind:'playback')} error</div>
        <h2>${esc(snap.state==='exhausted'?'No source would play':'This source stopped')}</h2>
        <p>${esc(failure?failure.text:'Playback could not continue.')}</p>
        ${failed?`<div class="failed-source">Failed: ${esc(failed.title)}${failed.addonName?' · '+esc(failed.addonName):''}</div>`:''}
        <div class="error-actions">
          <button class="btn btn-primary" data-player-action="retry">${icon('play')} Retry</button>
          ${snap.canTryNext?'<button class="btn btn-ghost" data-player-action="next">Try next source</button>':''}
          <button class="btn btn-ghost" data-player-action="choose">Choose source</button>
          <button class="btn btn-ghost" data-close-player>Close</button>
        </div></div>`;
      clearTimeout(player.noticeTimer);player.noticeTimer=null;player.notice=null;
      if(status)status.innerHTML='';
    }
    function renderTools(snap){
      const tools=$('#playerTools');if(!tools)return;
      const episodic=PB.episodes.isEpisodic(player.meta);
      const prev=episodic?PB.episodes.previousEpisode(player.meta.videos,player.video.id):null;
      const next=episodic?PB.episodes.nextEpisode(player.meta.videos,player.video.id):null;
      const audioTracks=player.adapter&&player.adapter.getAudioTracks?player.adapter.getAudioTracks():[];
      tools.innerHTML=[
        episodic?`<button class="tool-btn" data-episode-nav="prev" ${prev?'':'disabled'} aria-label="Previous episode">‹</button>`:'',
        episodic?`<button class="tool-btn" data-episode-nav="next" ${next?'':'disabled'} aria-label="Next episode">›</button>`:'',
        player.subtitleTracks.length?`<button class="tool-btn ${player.activeSubtitle?'on':''}" data-track-menu="text" aria-label="Subtitles">CC</button>`:'',
        audioTracks.length>1?`<button class="tool-btn" data-track-menu="audio" aria-label="Audio track">AUD</button>`:'',
        `<button class="tool-btn" data-player-action="choose" aria-label="Choose source">${icon('link')}</button>`,
        document.fullscreenEnabled?`<button class="tool-btn" data-player-action="fullscreen" aria-label="Fullscreen">⛶</button>`:''
      ].filter(Boolean).join('');
      bindDynamic(tools);
    }

    function playerAction(action){
      const session=player.session;
      if(action==='fullscreen'){const modal=$('.player-modal');if(!document.fullscreenElement)modal?.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.();return}
      if(action==='choose'){closePlayer();const root=$('#streamRoot');if(root){renderStreams();root.scrollIntoView({behavior:motionOk()?'smooth':'auto',block:'start'})}return}
      if(!session)return;
      if(action==='retry')session.retry();
      if(action==='next')session.tryNext();
    }
    function closePlayer(silent){
      clearTimeout(player.idleTimer);
      clearTimeout(player.noticeTimer);player.noticeTimer=null;player.notice=null;
      if(player.countdown){player.countdown.cancel();player.countdown=null}
      $('#countdownCard')?.remove();$('#trackMenu')?.remove();
      if(player.session){player.session.cancel();player.session=null}
      teardownAttempt();
      progress.flush();
      player.meta=null;player.video=null;
      if(silent===true)return;
      if(!state.currentMeta){closeModal();return}
      showDetail(state.currentMeta,false);
      // Closing the player returns to the sources already loaded for this video.
      if(player.ranked.length)renderStreams();
    }

    /* ---- series continuity ---------------------------------------------- */
    function onEpisodeEnded(){
      const m=player.meta,v=player.video;
      if(!PB.episodes.isEpisodic(m))return;
      const next=PB.episodes.nextEpisode(m.videos,v.id);
      if(!next){toast('You reached the end.','good');return}
      if(!state.settings.autoplayNext)return;
      startCountdown(next);
    }
    function startCountdown(next){
      const stage=$('#playerStage');if(!stage)return;
      const modal=$('.player-modal');if(!modal)return;
      const card=document.createElement('div');
      card.className='countdown-card';card.id='countdownCard';
      const seconds=10;
      card.innerHTML=`<div class="eyebrow">Up next</div><b>${esc(PB.episodes.episodeLabel(next))}</b>
        <div class="countdown-meter"><i id="countdownMeter" style="width:100%"></i></div>
        <div class="countdown-actions"><button class="btn btn-primary" data-countdown="now">Play now</button><button class="btn btn-ghost" data-countdown="cancel">Cancel</button></div>`;
      modal.appendChild(card);
      bindDynamic(card);
      player.countdown=PB.episodes.createCountdown({
        seconds,
        onTick:remaining=>{const meter=$('#countdownMeter');if(meter)meter.style.width=(remaining/seconds*100)+'%'},
        onDone:()=>{player.countdown=null;card.remove();goToEpisode(next)}

    }
    function cancelCountdown(){

    }
    async function goToEpisode(video){
      const m=player.meta||state.currentMeta;
      if(!m||!video)return;
      const activeId=player.session?.snapshot().activeId,previous=player.ranked.find(e=>candidateKey(e)===activeId);

      closePlayer(true);
      player.preferredBingeGroup=preferredBingeGroup;
      state.currentMeta=m;showDetail(m,false);
      // A fresh lookup: streams from the previous episode are never reused.
      state.currentStreams=[];player.ranked=[];
      toast(`Up next: ${PB.episodes.episodeLabel(video)}`,'good');
      await loadStreams(video.id,true);
    }

    /* ---- subtitles and audio -------------------------------------------- */
    async function attachSubtitles(el,s,m,v,scope,live){
      try{
        const sources=manifests().filter(x=>hasResource(x.manifest,'subtitles',m.type,v.id));
        const rs=await Promise.allSettled(sources.map(x=>fetchJSON(endpoint(x.addon,'subtitles',m.type,v.id,{videoHash:s.behaviorHints?.videoHash,videoSize:s.behaviorHints?.videoSize}))));
        if(!live()||scope.disposed)return;
        const raw=[...(s.subtitles||[]),...rs.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.subtitles||[])];
        const tracks=PB.subtitles.normalizeTracks(raw,{pageUrl:location.href});
        const attached=await PB.subtitles.attachTracks({media:el,scope,tracks,settings:state.settings,isCancelled:()=>!live()});
        if(!live()||scope.disposed)return;
        player.subtitleAttached=attached;
        player.subtitleTracks=attached.map(a=>a.track);
        const preferred=PB.subtitles.pickDefault(player.subtitleTracks,state.settings);
        if(preferred){player.activeSubtitle=preferred.id;PB.subtitles.selectAttachedTrack(el,attached,preferred.id)}
        renderTools(player.session?player.session.snapshot():{});
      }catch{/* subtitles are best effort and never fail playback */}
    }
    function refreshAudioTracks(tracks){
      const list=Array.isArray(tracks)?tracks:[];
      if(!player.audioPreferenceApplied&&list.length){
        player.audioPreferenceApplied=true;
        const wanted=String(state.settings.audioLanguage||'original').toLowerCase();
        if(wanted!=='original'){
          const chosen=list.find(t=>String(t.lang||'').toLowerCase().split('-')[0]===wanted.split('-')[0]);
          if(chosen&&player.adapter?.selectAudioTrack)player.adapter.selectAudioTrack(chosen.id);
        }
      }
      renderTools(player.session?player.session.snapshot():{});
    }
    function openTrackMenu(kind){
      closeTrackMenu();
      const modal=$('.player-modal');if(!modal)return;
      const menu=document.createElement('div');menu.className='track-menu';menu.id='trackMenu';
      if(kind==='text'){
        const options=[{id:'',label:'Off',active:!player.activeSubtitle},...player.subtitleTracks.map(t=>({id:t.id,label:t.label,active:player.activeSubtitle===t.id}))];
        menu.innerHTML=`<h4>Subtitles</h4>${options.map(o=>`<button class="track-option ${o.active?'active':''}" data-text-track="${esc(o.id)}">${esc(o.label)}${o.active?icon('check'):''}</button>`).join('')}`;
      }else{
        const tracks=player.adapter&&player.adapter.getAudioTracks?player.adapter.getAudioTracks():[];
        menu.innerHTML=`<h4>Audio</h4>${tracks.map(t=>`<button class="track-option ${t.active?'active':''}" data-audio-track="${esc(t.id)}">${esc(t.label)}${t.active?icon('check'):''}</button>`).join('')}`;
      }
      modal.appendChild(menu);bindDynamic(menu);player.menu=kind;
    }
    function closeTrackMenu(){$('#trackMenu')?.remove();player.menu=null}
    function selectSubtitle(id){
      const el=$('#mediaEl');
      const chosen=player.subtitleTracks.find(t=>t.id===id)||null;
      player.activeSubtitle=chosen?chosen.id:null;
      if(el)PB.subtitles.selectAttachedTrack(el,player.subtitleAttached,chosen?chosen.id:null);
      // Remember the language for next time; the id is per-session.
      if(chosen&&chosen.lang){state.settings.subtitleLanguage=chosen.lang;state.settings.subtitlesDefault=true}
      else if(!chosen)state.settings.subtitlesDefault=false;
      state.settings=PB.settings.migrate(state.settings);
      store.set('settings',state.settings);
      closeTrackMenu();renderTools(player.session?player.session.snapshot():{});
    }
    function selectAudioTrack(id){
      const tracks=player.adapter&&player.adapter.getAudioTracks?player.adapter.getAudioTracks():[];
      const chosen=tracks.find(t=>String(t.id)===String(id));
      const changed=player.adapter&&player.adapter.selectAudioTrack?player.adapter.selectAudioTrack(id):false;
      if(changed&&chosen){state.settings.audioLanguage=chosen.lang||'original';state.settings=PB.settings.migrate(state.settings);store.set('settings',state.settings)}
      closeTrackMenu();renderTools(player.session?player.session.snapshot():{});
    }
    function showTorrent(s){const raw=s.raw||s,sources=raw.sources||[],fileIdx=s.fileIdx??s.facts?.fileIdx,filename=s.facts?.filename||raw.behaviorHints?.filename||'';const magnet=`magnet:?xt=urn:btih:${encodeURIComponent(s.infoHash)}${sources.filter(x=>x.startsWith('tracker:')).map(x=>'&tr='+encodeURIComponent(x.slice(8))).join('')}`;$('#modalRoot').innerHTML=`<div class="modal-shell" data-dismiss><section class="modal"><div class="modal-head"><h2>Torrent stream</h2><button class="icon-btn" data-close>${icon('close')}</button></div><div class="modal-body"><div class="notice warn">Chrome cannot stream a BitTorrent info hash by itself. Configure Comet with a debrid provider so it returns an HTTPS stream, or open this result in an installed torrent-capable app.</div><div class="field"><label>Info hash</label><input class="text-input" readonly value="${esc(s.infoHash)}"></div>${fileIdx!==null&&fileIdx!==undefined?`<div class="field"><label>Selected file index</label><input class="text-input" readonly value="${esc(fileIdx)}">${filename?`<small>${esc(filename)}</small>`:''}</div>`:''}<div class="actions"><a class="btn btn-primary" href="${esc(magnet)}">${icon('external')} Open magnet</a><button class="btn btn-ghost" data-copy="${esc(magnet)}">Copy magnet link</button></div></div></section></div>`;bindDynamic($('#modalRoot'))}
    const PLAYER_LIBS={hls:{src:'https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js',integrity:'sha384-z+tuLqMWl1/cPv7O+39RO0EURSNvorimpcCaMgeNwU+qFBx+AlUIl7jaAwg0cYil',label:'HLS'},dash:{src:'https://cdn.jsdelivr.net/npm/dashjs@5.2.0/dist/modern/umd/dash.all.min.js',integrity:'sha384-DUqWPzOl/i7/DGF7SBoe4NrlZOMxxomlJsg3X0daS5SBeFxco3dmwWQPFr2oauXn',label:'DASH'}};
    function loadPlayerLib(name){const lib=PLAYER_LIBS[name];return new Promise((res,rej)=>{const x=document.createElement('script');x.src=lib.src;x.integrity=lib.integrity;x.crossOrigin='anonymous';x.referrerPolicy='no-referrer';x.onload=res;x.onerror=()=>rej(Error(`Could not load the pinned ${lib.label} playback library. The download failed or its integrity hash did not match.`));document.head.append(x)})}
    function loadHls(){return window.Hls?Promise.resolve():loadPlayerLib('hls')}
    function loadDash(){return window.dashjs?Promise.resolve():loadPlayerLib('dash')}
    function toggleLibrary(key){const m=state.metaCache.get(key)||state.currentMeta;if(!m)return;if(state.library[key]){delete state.library[key];toast('Removed from library')}else{state.library[key]={meta:m,added:Date.now()};toast('Added to library','good')}store.set('library',state.library);if(state.currentMeta&&mediaKey(state.currentMeta)===key)showDetail(state.currentMeta,false);else if(state.currentPage==='library')renderLibrary()}
    function installModal(){const root=$('#modalRoot');root.innerHTML=`<div class="modal-shell" data-dismiss><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>Install a Stremio add-on</h2><button class="icon-btn" data-close>${icon('close')}</button></div><div class="modal-body"><div class="notice">Paste an add-on's configured <b>manifest.json</b> URL or a <b>stremio://</b> install link. Comet configuration tokens remain within your browser storage.</div><form id="installForm"><div class="field"><label for="manifestInput">Manifest URL</label><div class="input-action"><input class="text-input" id="manifestInput" placeholder="https://…/manifest.json" required><button class="btn btn-primary" type="submit">Install</button></div><small>Remote manifests must use HTTPS and permit browser CORS requests.</small></div></form><div class="notice warn">Only install add-ons you trust. An add-on controls the metadata and stream URLs returned to this browser.</div></div></section></div>`;bindDynamic(root);$('#installForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter,input=$('#manifestInput'),owned=currentModal();btn.disabled=true;btn.textContent='Checking…';try{await installAddon(input.value);if(currentModal()!==owned)return;closeModal()}catch(err){if(currentModal()!==owned)return;toast(err.message,'bad');btn.disabled=false;btn.textContent='Install'}};setTimeout(()=>$('#manifestInput')?.focus(),100)}
    function settingsModal(){const s=state.settings;$('#modalRoot').innerHTML=`<div class="modal-shell" data-dismiss><section class="modal"><div class="modal-head"><h2>Settings</h2><button class="icon-btn" data-close>${icon('close')}</button></div><div class="modal-body"><div class="field"><label for="maxResolution">Maximum auto-play quality</label><select class="select" id="maxResolution" style="width:100%">${['2160p','1080p','720p','480p'].map(x=>`<option ${s.maxResolution===x?'selected':''} value="${x}">${x==='2160p'?'4K':x}</option>`).join('')}</select><small>Auto Play Best respects AIOStreams order and skips higher resolutions.</small></div><div class="switch-row"><div><b>Autoplay next episode</b><span>Open the next episode and choose its best compatible source.</span></div><button class="switch ${s.autoplayNext?'on':''}" data-setting="autoplayNext"><i></i></button></div><div class="switch-row"><div><b>Prefer cached sources</b><span>Rank instantly available debrid results above uncached ones.</span></div><button class="switch ${s.preferCached?'on':''}" data-setting="preferCached"><i></i></button></div><div class="field"><label for="hdrPreference">HDR and Dolby Vision</label><select class="select" id="hdrPreference" style="width:100%">${[['prefer','Prefer HDR'],['neutral','No preference'],['avoid','Avoid HDR']].map(([v,l])=>`<option ${s.hdrPreference===v?'selected':''} value="${v}">${l}</option>`).join('')}</select><small>Choose Avoid if HDR content looks washed out on this screen.</small></div><div class="switch-row"><div><b>Automatic failover</b><span>If a source fails to start, try the next ranked source automatically.</span></div><button class="switch ${s.autoFailover?'on':''}" data-setting="autoFailover"><i></i></button></div><div class="field"><label for="audioLanguage">Preferred audio</label><select class="select" id="audioLanguage" style="width:100%">${audioLanguageChoices(s.audioLanguage).map(([v,l])=>`<option ${s.audioLanguage===v?'selected':''} value="${v}">${l}</option>`).join('')}</select><small>Applied when HLS or DASH exposes selectable tracks. Direct files depend on Android Chrome.</small></div><div class="field"><label for="subtitleLanguage">Preferred subtitle language</label><select class="select" id="subtitleLanguage" style="width:100%">${[['en','English'],['es','Spanish'],['fr','French'],['de','German'],['pt','Portuguese'],['it','Italian'],['nl','Dutch'],['sv','Swedish'],['pl','Polish'],['ru','Russian'],['ja','Japanese'],['ko','Korean'],['zh','Chinese'],['ar','Arabic'],['hi','Hindi']].map(([v,l])=>`<option ${s.subtitleLanguage===v?'selected':''} value="${v}">${l}</option>`).join('')}</select></div><div class="switch-row"><div><b>Subtitles on by default</b><span>Turn on your preferred language whenever a matching track exists.</span></div><button class="switch ${s.subtitlesDefault?'on':''}" data-setting="subtitlesDefault"><i></i></button></div><div class="switch-row"><div><b>Show adult catalogs</b><span>Show add-ons or catalogs that explicitly mark themselves as adult.</span></div><button class="switch ${s.showAdult?'on':''}" data-setting="showAdult"><i></i></button></div><div class="notice warn" style="margin-top:20px">Exports include configured add-on URLs, which may contain private service tokens. Keep backup files private.</div><div class="actions" style="margin-top:22px"><button class="btn btn-primary" data-save-settings>Save settings</button><button class="btn btn-ghost" data-export>${icon('download')} Private backup</button><label class="btn btn-ghost">${icon('upload')} Import backup<input class="hidden" id="importFile" type="file" accept="application/json"></label></div><p class="muted" style="font-size:11px;margin-top:24px">Astra ${APP_VERSION} · Your add-ons, library, settings, and progress are stored locally in Chrome.</p></div></section></div>`;bindDynamic($('#modalRoot'))}
    function exportData(){const data={app:'Astra',version:APP_VERSION,exported:new Date().toISOString(),addons:state.addons,library:state.library,progress:progress.snapshot(),settings:state.settings};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='astra-backup.json';a.click();URL.revokeObjectURL(a.href)}
    async function importData(file){const owned=currentModal();try{const d=JSON.parse(await file.text());if(d.app!=='Astra'||!Array.isArray(d.addons))throw Error('Not an Astra backup');state.addons=d.addons;state.library=d.library||{};progress.replace(d.progress||{});state.settings=AstraPlayback.settings.migrate({...state.settings,...d.settings});for(const k of ['addons','library','settings'])store.set(k,state[k]);state.manifests.clear();state.catalogCache.clear();await loadManifests(true);toast('Backup imported','good');if(currentModal()===owned)closeModal();renderHome()}catch(e){toast(`Import failed: ${e.message}`,'bad')}}
    function bindDynamic(root=document){hydrateIcons(root);$$('[data-nav]',root).forEach(x=>x.onclick=()=>{if(root!==document)closeModal();nav(x.dataset.nav)});$$('[data-close]',root).forEach(x=>x.onclick=()=>closeModal());$$('[data-close-player]',root).forEach(x=>x.onclick=()=>closePlayer());$$('[data-dismiss]',root).forEach(x=>x.onclick=e=>{if(e.target===x)closeModal()});$$('[data-open]',root).forEach(x=>x.onclick=()=>openMedia(x.dataset.open));$$('[data-library]',root).forEach(x=>x.onclick=()=>toggleLibrary(x.dataset.library));$$('[data-get-streams]',root).forEach(x=>x.onclick=()=>loadStreams(x.dataset.getStreams));$$('[data-play-source]',root).forEach(x=>x.onclick=()=>openPlayer(entryById(x.dataset.playSource)));$$('[data-play-best]',root).forEach(x=>x.onclick=()=>{const best=AstraPlayback.streams.bestCandidate(player.ranked);if(best)openPlayer(best)});$$('[data-stream-filter]',root).forEach(x=>x.onclick=()=>{state.streamFilter=x.dataset.streamFilter;renderStreams()});$$('[data-stream-sort]',root).forEach(x=>x.onchange=()=>{state.streamSort=x.value;renderStreams()});$$('[data-player-action]',root).forEach(x=>x.onclick=()=>playerAction(x.dataset.playerAction));$$('[data-episode-nav]',root).forEach(x=>x.onclick=()=>{const dir=x.dataset.episodeNav,m=player.meta;if(!m)return;const target=dir==='next'?AstraPlayback.episodes.nextEpisode(m.videos,player.video.id):AstraPlayback.episodes.previousEpisode(m.videos,player.video.id);if(target)goToEpisode(target)});$$('[data-countdown]',root).forEach(x=>x.onclick=()=>{if(x.dataset.countdown==='cancel')cancelCountdown();else if(player.countdown)player.countdown.finishNow()});$$('[data-track-menu]',root).forEach(x=>x.onclick=()=>{if(player.menu===x.dataset.trackMenu)closeTrackMenu();else openTrackMenu(x.dataset.trackMenu)});$$('[data-text-track]',root).forEach(x=>x.onclick=()=>selectSubtitle(x.dataset.textTrack));$$('[data-audio-track]',root).forEach(x=>x.onclick=()=>selectAudioTrack(x.dataset.audioTrack));$$('[data-load-more]',root).forEach(x=>x.onclick=()=>{state.discoverVisible+=DISCOVER_BATCH;renderDiscoverPage()});$$('[data-browse-catalog]',root).forEach(x=>x.onclick=()=>{state.discover.catalog=x.dataset.browseCatalog;state.discoverVisible=DISCOVER_BATCH;nav('discover')});$$('[data-season]',root).forEach(x=>x.onclick=()=>{$$('[data-season]',root).forEach(c=>c.classList.toggle('active',c===x));$('#episodeList').innerHTML=episodeHTML(state.currentMeta.videos,x.dataset.season);bindDynamic($('#episodeList'))});$$('[data-action="install"]',root).forEach(x=>x.onclick=installModal);$$('[data-action="settings"]',root).forEach(x=>x.onclick=settingsModal);$$('[data-configure]',root).forEach(x=>x.onclick=()=>{const u=safeUrl(x.dataset.configure);if(u&&/^https?:/i.test(u))window.open(u,'_blank','noopener');else toast('The add-on returned an unsafe configuration link.','bad')});$$('[data-toggle-addon]',root).forEach(x=>x.onclick=async()=>{const a=addonByUrl(x.dataset.toggleAddon);a.enabled=a.enabled===false;store.set('addons',state.addons);state.catalogCache.clear();await loadManifests();renderAddons()});$$('[data-remove-addon]',root).forEach(x=>x.onclick=()=>{const a=addonByUrl(x.dataset.removeAddon);if(!confirm(`Remove ${a.name||'this add-on'}?`))return;state.addons=state.addons.filter(n=>n!==a);state.manifests.delete(a.url);store.set('addons',state.addons);state.catalogCache.clear();renderAddons()});$$('[data-copy]',root).forEach(x=>x.onclick=async()=>{try{await navigator.clipboard.writeText(x.dataset.copy);toast('Copied','good')}catch{toast('Chrome blocked clipboard access.','bad')}});$$('[data-setting]',root).forEach(x=>x.onclick=()=>{const k=x.dataset.setting;state.settings[k]=!state.settings[k];x.classList.toggle('on',state.settings[k])});$$('[data-save-settings]',root).forEach(x=>x.onclick=()=>{state.settings.maxResolution=$('#maxResolution')?.value||'2160p';state.settings.hdrPreference=$('#hdrPreference')?.value||'neutral';state.settings.audioLanguage=$('#audioLanguage')?.value||'original';state.settings.subtitleLanguage=$('#subtitleLanguage')?.value||'en';state.settings=AstraPlayback.settings.migrate(state.settings);store.set('settings',state.settings);toast('Settings saved','good');closeModal()});$$('[data-export]',root).forEach(x=>x.onclick=exportData);const imp=$('#importFile',root);if(imp)imp.onchange=()=>imp.files[0]&&importData(imp.files[0])}
    function globalEvents(){document.addEventListener('click',e=>{const a=e.target.closest('[data-action="settings"]');if(a)settingsModal()});$('#globalSearch').addEventListener('input',e=>{const q=e.target.value;$('#searchClear').classList.toggle('hidden',!q);clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(q),450)});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);search(e.target.value)}});$('#searchClear').onclick=()=>{$('#globalSearch').value='';$('#searchClear').classList.add('hidden');nav('home')};document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#trackMenu')){closeTrackMenu();return}if($('#countdownCard')){cancelCountdown();return}if($('#modalRoot').children.length){if($('#mediaEl')||$('#playerStage iframe'))closePlayer();else closeModal()}});window.addEventListener('pagehide',()=>progress.flush());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')progress.flush()})}
    async function init(){buildNav();hydrateIcons();bindDynamic();globalEvents();await renderHome()}
    init().catch(e=>{console.error(e);toast('Astra could not start: '+e.message,'bad')});
  })();
  </script>
</body>
</html>
