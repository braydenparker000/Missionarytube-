<body>
  <aside class="sidebar">
    <button class="brand" data-nav="home" aria-label="Astra home"><span data-icon="spark"></span></button>
    <nav class="nav" id="desktopNav"></nav>
    <div class="side-foot"><button class="nav-btn" data-action="settings"><span data-icon="settings"></span><span>Settings</span></button></div>
  </aside>
  <main>
    <header class="topbar" id="topbar">
      <div class="mobile-title">ASTRA</div>
      <div class="search-wrap"><span data-icon="search"></span><label class="sr-only" for="globalSearch">Search</label><input class="search" id="globalSearch" autocomplete="off" placeholder="Search across your add-ons"><button class="search-clear hidden" id="searchClear" aria-label="Clear">×</button></div>
      <button class="avatar" data-action="settings" aria-label="Settings">A</button>
    </header>
    <section class="page active" id="page-home"><div id="homeRoot"></div></section>
    <section class="page" id="page-discover"><div class="content" id="discoverRoot"></div></section>
    <section class="page" id="page-search"><div class="content" id="searchRoot"></div></section>
    <section class="page" id="page-library"><div class="content" id="libraryRoot"></div></section>
    <section class="page" id="page-addons"><div class="content" id="addonsRoot"></div></section>
  </main>

  <div id="modalRoot"></div><div class="toast-wrap" id="toastRoot"></div>

  <script src="assets/js/progress-store.js"></script>
  <script>
  (()=>{'use strict';
    const APP_VERSION='0.9.0',HOME_LIMIT=24,DISCOVER_BATCH=60;

    const storageArea=(()=>{try{const s=globalThis.localStorage;s.getItem(KEY+'probe');return s}catch{return null}})();

    const state={addons:store.get('addons',DEFAULT_ADDONS),manifests:new Map(),catalogCache:new Map(),metaCache:new Map(),currentPage:'home',currentMeta:null,currentVideo:null,currentStreams:[],streamFilter:'all',homeItems:[],discoverItems:[],discoverVisible:DISCOVER_BATCH,library:store.get('library',{}),settings:{...DEFAULT_SETTINGS,...store.get('settings',{})},discover:{type:'all',addon:'all',catalog:'all',genre:'all'},searchToken:0};

    const icons={home:'<path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',discover:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',library:'<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16l-8-4-8 4z"/>',addons:'<path d="M8 3v4H4v4H2v4h2v4h4v2h4v-5h3v-4h5V8h-5V3h-4v5H8V3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 3.6 15a1.7 1.7 0 0 0-1.6-1H2v-4h.1A1.7 1.7 0 0 0 3.6 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8 3.6a1.7 1.7 0 0 0 1.6-1.6V2h4v.1A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 20.4 8a1.7 1.7 0 0 0 1.6 1.6h.1v4H22a1.7 1.7 0 0 0-1.6 1.4z"/>',spark:'<path d="m12 2 2.2 6.1L20 10l-5.8 2L12 18l-2.2-6L4 10l5.8-1.9z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',play:'<path d="m8 5 11 7-11 7z"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M17 9h4M3 15h4M17 15h4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/>',radio:'<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',external:'<path d="M14 3h7v7M10 14 21 3"/><path d="M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',download:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>',upload:'<path d="M12 16V4m0 0 5 5m-5-5L7 9M4 21h16"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'};
    function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.film}</svg>`}
    function hydrateIcons(root=document){$$('[data-icon]',root).forEach(e=>e.innerHTML=icon(e.dataset.icon))}
    const navs=[['home','home','Home'],['discover','discover','Discover'],['library','library','Library'],['addons','addons','Add-ons']];
    function buildNav(){const html=navs.map(([id,ic,label])=>`<button class="nav-btn ${id==='home'?'active':''}" data-nav="${id}">${icon(ic)}<span>${label}</span></button>`).join('');$('#desktopNav').innerHTML=html;$('#mobileNav').innerHTML=html}
    function toast(msg,type=''){const n=document.createElement('div');n.className='toast '+type;n.innerHTML=`<span>${type==='bad'?'⚠':'✦'}</span><div>${esc(msg)}</div>`;$('#toastRoot').append(n);setTimeout(()=>n.remove(),4200)}
    function normalizeManifestUrl(raw){let s=String(raw||'').trim();if(!s)throw Error('Paste an add-on manifest URL.');if(s.startsWith('stremio://'))s='https://'+s.slice(10);if(!/^https?:\/\//i.test(s))s='https://'+s;const u=new URL(s);if(u.protocol!=='https:'&&u.hostname!=='127.0.0.1'&&u.hostname!=='localhost')throw Error('Remote add-ons must use HTTPS.');if(!u.pathname.endsWith('manifest.json'))u.pathname=u.pathname.replace(/\/$/,'')+'/manifest.json';return u.href}
    function addonBase(url){return url.replace(/\/manifest\.json(?:\?.*)?$/,'')}
    async function fetchJSON(url,timeout=14000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{mode:'cors',signal:ctrl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}catch(e){if(e.name==='AbortError')throw Error('Request timed out');throw e}finally{clearTimeout(timer)}}
    function hasResource(m,name,type,id){return (m.resources||[]).some(r=>{if(typeof r==='string')return r===name;if(r.name!==name)return false;if(r.types?.length&&type&&!r.types.includes(type))return false;if(r.idPrefixes?.length&&id&&!r.idPrefixes.some(p=>String(id).startsWith(p)))return false;return true})}
    function endpoint(addon,resource,type,id,extra){const base=addonBase(addon.url),parts=[resource,encodeURIComponent(type),encodeURIComponent(id)];if(extra&&Object.keys(extra).length){const x=Object.entries(extra).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');if(x)parts.push(x)}return `${base}/${parts.join('/')}.json`}
    function addonByUrl(url){return state.addons.find(a=>a.url===url)}
    async function loadManifests(force=false){const active=state.addons.filter(a=>a.enabled!==false);await Promise.allSettled(active.map(async a=>{if(!force&&state.manifests.has(a.url))return;try{const m=await fetchJSON(a.url);if(!m.id||!m.name)throw Error('Invalid manifest');state.manifests.set(a.url,m);a.error='';a.name=m.name;a.logo=m.logo||''}catch(e){a.error=e.message;state.manifests.delete(a.url)}}));store.set('addons',state.addons)}
    function manifests(){return state.addons.filter(a=>a.enabled!==false&&state.manifests.has(a.url)).map(a=>({addon:a,manifest:state.manifests.get(a.url)}))}
    async function installAddon(raw){const url=normalizeManifestUrl(raw);if(addonByUrl(url))throw Error('That add-on is already installed.');const m=await fetchJSON(url);if(!m.id||!m.name||!Array.isArray(m.resources))throw Error('The URL did not return a valid Stremio manifest.');state.addons.push({url,enabled:true,name:m.name,logo:m.logo||'',official:false});state.manifests.set(url,m);store.set('addons',state.addons);toast(`${m.name} installed`,'good');renderAddons();return m}
    function mediaKey(m){return `${m.type||'movie'}:${m.id}`}
    function recordMeta(m,source){const item={...m,_addonUrl:source?.addon?.url||m._addonUrl,_addonName:source?.manifest?.name||m._addonName};state.metaCache.set(mediaKey(item),item);return item}
    async function getCatalog(source,cat,extra={}){const key=source.addon.url+'|'+cat.type+'|'+cat.id+'|'+JSON.stringify(extra);if(state.catalogCache.has(key))return state.catalogCache.get(key);const p=fetchJSON(endpoint(source.addon,'catalog',cat.type,cat.id,extra)).then(d=>(d.metas||[]).map(x=>recordMeta({...x,type:x.type||cat.type},source))).catch(e=>{state.catalogCache.delete(key);throw e});state.catalogCache.set(key,p);return p}
    function catalogExtras(cat,overrides={}){const out={};for(const e of cat.extra||[]){if(e.isRequired&&e.name!=='search'&&e.name!=='skip'&&e.options?.length)out[e.name]=e.options[0]}return {...out,...overrides}}
    function yearOf(m){return m.releaseInfo||m.year||(m.released?String(m.released).slice(0,4):'')}
    function poster(m){return safeUrl(m.poster||m.background||m.logo||'')}
    function backdrop(m){return safeUrl(m.background||m.poster||'')}
    function progressEntries(m){return progress.entriesFor(mediaKey(m))}
    function latestProgress(m){return progress.latest(mediaKey(m))}
    function videoProgress(m,videoId){return progress.get(mediaKey(m),videoId)}
    function cardHTML(m){const p=poster(m),prog=latestProgress(m),source=m._addonName||'',watched=m.type!=='series'&&prog?.completed;return `<button class="card" data-open="${esc(mediaKey(m))}" aria-label="Open ${esc(m.name||m.title||'title')}"><div class="poster">${p?`<img loading="lazy" src="${esc(p)}" alt="" onerror="this.style.display='none'">`:''}<div class="poster-fallback">${icon(m.type==='channel'?'radio':'film')}</div>${source?`<span class="source-pill">${esc(source)}</span>`:''}${watched?`<span class="watched-mark">${icon('check')}</span>`:''}${prog?.duration&&!prog.completed?`<span class="progress"><i style="width:${Math.min(100,prog.time/prog.duration*100)}%"></i></span>`:''}</div><div class="card-title">${esc(m.name||m.title||'Untitled')}</div><div class="card-sub">${esc([yearOf(m),m.type,prog&&!prog.completed?`${Math.round(prog.time/prog.duration*100)}%`:watched?'Watched':''].filter(Boolean).join(' · '))}</div></button>`}
    function emptyHTML(title,text,action=''){return `<div class="empty">${icon('film')}<h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`}
    function skeletonRail(){return `<div class="rail">${Array.from({length:7},()=>'<div><div class="poster skeleton"></div><div class="skeleton" style="height:12px;margin-top:9px;border-radius:5px"></div></div>').join('')}</div>`}
    function nav(page){state.currentPage=page;$$('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${page}`));$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));if(page==='discover')renderDiscover();if(page==='library')renderLibrary();if(page==='addons')renderAddons();if(page==='home'&&!$('#homeRoot').children.length)renderHome();window.scrollTo({top:0,behavior:'smooth'})}
    async function renderHome(){const root=$('#homeRoot');root.innerHTML=`<div class="hero"><div class="hero-bg"></div><div class="hero-copy"><div class="eyebrow">Add-on powered</div><h1>Your universe<br>of stories.</h1><p>Install a Stremio add-on to bring its films, series, music, radio, and channels into one beautiful place.</p><div class="actions"><button class="btn btn-primary" data-nav="addons">${icon('plus')} Add an add-on</button><button class="btn btn-ghost" data-nav="discover">${icon('discover')} Explore</button></div></div></div><div class="content" id="homeSections"><section class="section"><div class="section-head"><h2 class="section-title">Loading your universe</h2></div>${skeletonRail()}</section></div>`;
      const sections=$('#homeSections');await loadManifests();const sources=manifests(),jobs=[];sources.forEach(s=>(s.manifest.catalogs||[]).slice(0,8).forEach(cat=>jobs.push({s,cat})));if(!jobs.length){sections.innerHTML=emptyHTML('No catalogs yet','Install or enable an add-on to populate your home screen.',`<button class="btn btn-primary" data-nav="addons">${icon('plus')} Add an add-on</button>`);return}
      const results=await Promise.allSettled(jobs.slice(0,18).map(async j=>({...j,items:await getCatalog(j.s,j.cat,catalogExtras(j.cat))})));const good=results.filter(x=>x.status==='fulfilled'&&x.value.items.length).map(x=>x.value);state.homeItems=good.flatMap(x=>x.items);if(!good.length){sections.innerHTML=emptyHTML('Catalogs could not load','Check your connection and add-on status. Some add-ons require a configured manifest URL.',`<button class="btn btn-primary" data-nav="addons">Manage add-ons</button>`);return}
      const featured=good.flatMap(x=>x.items).find(x=>backdrop(x))||good[0].items[0];setHero(featured);sections.innerHTML='';const cont=continueItems();if(cont.length)sections.insertAdjacentHTML('beforeend',railSection('Continue watching',cont,'Saved on this device'));
      good.forEach(({s,cat,items})=>sections.insertAdjacentHTML('beforeend',railSection(cat.name||`${cat.type} · ${s.manifest.name}`,items,`${s.manifest.name} · ${cat.type}`,`${s.addon.url}|${cat.type}|${cat.id}`)));bindDynamic()}
    function setHero(m){if(!m)return;const h=$('.hero'),bg=$('.hero-bg',h),copy=$('.hero-copy',h),b=backdrop(m);bg.style.backgroundImage=b?`url("${b.replace(/"/g,'%22')}")`:'';copy.innerHTML=`<div class="eyebrow">Featured · ${esc(m.type||'media')}</div><h1>${esc(m.name||m.title)}</h1><p>${esc(m.description||m.overview||'Open the details to discover available streams from your installed add-ons.')}</p><div class="actions"><button class="btn btn-primary" data-open="${esc(mediaKey(m))}">${icon('play')} View streams</button><button class="btn btn-ghost" data-library="${esc(mediaKey(m))}">${icon(state.library[mediaKey(m)]?'check':'plus')} ${state.library[mediaKey(m)]?'In library':'My library'}</button></div>`;bindDynamic(copy)}
    function railSection(title,items,note='',catalogKey=''){const shown=items.slice(0,HOME_LIMIT);return `<section class="section"><div class="section-head"><div><h2 class="section-title">${esc(title)}</h2><div class="section-note">${esc(note)}</div></div>${catalogKey&&items.length>HOME_LIMIT?`<button class="catalog-link" data-browse-catalog="${esc(catalogKey)}">See all</button>`:''}</div><div class="rail">${shown.map(cardHTML).join('')}</div></section>`}
    function allCatalogs(){return manifests().flatMap(s=>(s.manifest.catalogs||[]).filter(cat=>state.settings.showAdult||!(cat.adult||s.manifest.behaviorHints?.adult)).map(cat=>({s,cat})))}
    async function renderDiscover(){const root=$('#discoverRoot'),cats=allCatalogs(),types=[...new Set(cats.map(x=>x.cat.type))],genres=[...new Set(cats.flatMap(x=>(x.cat.extra||[]).filter(e=>e.name==='genre').flatMap(e=>e.options||[])))];root.innerHTML=`<h1 class="page-title">Discover</h1><p class="page-lede">Browse every catalog exposed by your enabled add-ons.</p><div class="filter-row"><select class="select" id="discoverType"><option value="all">All types</option>${types.map(x=>`<option ${state.discover.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" id="discoverAddon"><option value="all">All add-ons</option>${manifests().map(x=>`<option value="${esc(x.addon.url)}" ${state.discover.addon===x.addon.url?'selected':''}>${esc(x.manifest.name)}</option>`).join('')}</select><select class="select" id="discoverCatalog"><option value="all">All catalogs</option>${cats.map(x=>{const v=x.s.addon.url+'|'+x.cat.type+'|'+x.cat.id;return `<option value="${esc(v)}" ${state.discover.catalog===v?'selected':''}>${esc(x.cat.name)}</option>`}).join('')}</select>${genres.length?`<select class="select" id="discoverGenre"><option value="all">All genres</option>${genres.map(x=>`<option ${state.discover.genre===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}</div><div id="discoverResults">${skeletonRail()}</div>`;
      const refresh=()=>{state.discoverVisible=DISCOVER_BATCH;renderDiscoverResults()};$('#discoverType').onchange=e=>{state.discover.type=e.target.value;refresh()};$('#discoverAddon').onchange=e=>{state.discover.addon=e.target.value;refresh()};$('#discoverCatalog').onchange=e=>{state.discover.catalog=e.target.value;refresh()};if($('#discoverGenre'))$('#discoverGenre').onchange=e=>{state.discover.genre=e.target.value;refresh()};await renderDiscoverResults()}
    async function renderDiscoverResults(){let cats=allCatalogs();if(state.discover.catalog!=='all')cats=cats.filter(x=>`${x.s.addon.url}|${x.cat.type}|${x.cat.id}`===state.discover.catalog);else{if(state.discover.type!=='all')cats=cats.filter(x=>x.cat.type===state.discover.type);if(state.discover.addon!=='all')cats=cats.filter(x=>x.s.addon.url===state.discover.addon)}const out=$('#discoverResults');if(!out)return;out.innerHTML='<div class="loading-line"><span class="spinner"></span>Loading catalogs…</div>';const rs=await Promise.allSettled(cats.slice(0,20).map(async x=>{const supportsGenre=(x.cat.extra||[]).some(e=>e.name==='genre');const extra=catalogExtras(x.cat,supportsGenre&&state.discover.genre!=='all'?{genre:state.discover.genre}:{});return {...x,items:await getCatalog(x.s,x.cat,extra)}}));state.discoverItems=rs.filter(x=>x.status==='fulfilled').flatMap(x=>x.value.items).filter((m,i,a)=>a.findIndex(n=>mediaKey(n)===mediaKey(m))===i);renderDiscoverPage()}
    function renderDiscoverPage(){const out=$('#discoverResults');if(!out)return;const items=state.discoverItems,shown=items.slice(0,state.discoverVisible);out.innerHTML=items.length?`<div class="grid">${shown.map(cardHTML).join('')}</div>${shown.length<items.length?`<div class="load-more"><button class="btn btn-ghost" data-load-more>Load ${Math.min(DISCOVER_BATCH,items.length-shown.length)} more <span class="muted">· ${shown.length} of ${items.length}</span></button></div>`:''}`:emptyHTML('Nothing found','No items were returned by the selected catalogs.');bindDynamic(out)}
    function continueItems(){return progress.continueList()}
    function renderLibrary(){const root=$('#libraryRoot'),items=Object.values(state.library).sort((a,b)=>b.added-a.added).map(x=>x.meta);root.innerHTML=`<h1 class="page-title">My library</h1><p class="page-lede">Saved locally in this browser.</p>${items.length?`<div class="library-grid">${items.map(cardHTML).join('')}</div>`:emptyHTML('Your library is empty','Save something you want to watch or listen to later.',`<button class="btn btn-primary" data-nav="discover">Discover something</button>`)} `;bindDynamic(root)}
    function addonCard(a){const m=state.manifests.get(a.url),name=m?.name||a.name||new URL(a.url).hostname,desc=m?.description||(a.error?`Could not connect: ${a.error}`:'Manifest will load when enabled.'),resources=(m?.resources||[]).map(r=>typeof r==='string'?r:r.name);return `<article class="addon-card"><div class="addon-logo">${safeUrl(m?.logo||a.logo)?`<img src="${esc(safeUrl(m?.logo||a.logo))}" alt="">`:icon('addons')}</div><div class="addon-body"><div class="addon-name"><span class="status-dot ${a.enabled===false?'off':''}"></span>${esc(name)}</div><div class="addon-desc">${esc(desc)}</div><div class="addon-meta">${[...new Set(resources)].slice(0,6).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${m?.version?`<span class="tag">v${esc(m.version)}</span>`:''}</div><div class="addon-actions"><button class="btn btn-sm btn-ghost" data-toggle-addon="${esc(a.url)}">${a.enabled===false?'Enable':'Disable'}</button>${m?.configure?`<button class="btn btn-sm btn-ghost" data-configure="${esc(m.configure)}">Configure</button>`:''}${a.official?'':`<button class="btn btn-sm btn-danger" data-remove-addon="${esc(a.url)}">${icon('trash')} Remove</button>`}</div></div></article>`}
    async function renderAddons(){const root=$('#addonsRoot');root.innerHTML=`<div class="section-head"><div><h1 class="page-title">Add-ons</h1><p class="page-lede">Paste any compatible configured Stremio manifest URL.</p></div><button class="btn btn-primary" data-action="install">${icon('plus')} Install</button></div><div class="notice">For Comet and similar providers, finish configuration on the add-on's website and paste the resulting <b>manifest.json</b> URL here. Astra stores it only in this browser.</div><div class="addon-grid">${state.addons.map(addonCard).join('')}</div>`;bindDynamic(root)}
    let searchTimer;
    async function search(q){q=q.trim();const token=++state.searchToken;if(!q){nav('home');return}state.currentPage='search';$$('.page').forEach(x=>x.classList.toggle('active',x.id==='page-search'));$$('[data-nav]').forEach(x=>x.classList.remove('active'));const root=$('#searchRoot');root.innerHTML=`<h1 class="page-title">Search</h1><p class="page-lede">Results for “${esc(q)}” across enabled add-ons.</p><div class="loading-line"><span class="spinner"></span>Searching…</div>`;

    async function importData(file){try{const d=JSON.parse(await file.text());if(d.app!=='Astra'||!Array.isArray(d.addons))throw Error('Not an Astra backup');state.addons=d.addons;state.library=d.library||{};progress.replace(d.progress||{});state.settings={...state.settings,...d.settings};for(const k of ['addons','library','settings'])store.set(k,state[k]);state.manifests.clear();state.catalogCache.clear();await loadManifests(true);toast('Backup imported','good');$('#modalRoot').innerHTML='';renderHome()}catch(e){toast(`Import failed: ${e.message}`,'bad')}}
    function closePlayer(){const el=$('#mediaEl');if(el){el.pause();el._hls?.destroy();el._dash?.reset?.()}progress.flush();if(state.currentMeta)showDetail(state.currentMeta,false);else $('#modalRoot').innerHTML=''}
    function bindDynamic(root=document){hydrateIcons(root);$$('[data-nav]',root).forEach(x=>x.onclick=()=>{if(root!==document)$('#modalRoot').innerHTML='';nav(x.dataset.nav)});$$('[data-close]',root).forEach(x=>x.onclick=()=>$('#modalRoot').innerHTML='');$$('[data-close-player]',root).forEach(x=>x.onclick=closePlayer);$$('[data-dismiss]',root).forEach(x=>x.onclick=e=>{if(e.target===x)$('#modalRoot').innerHTML=''});$$('[data-open]',root).forEach(x=>x.onclick=()=>openMedia(x.dataset.open));$$('[data-library]',root).forEach(x=>x.onclick=()=>toggleLibrary(x.dataset.library));$$('[data-get-streams]',root).forEach(x=>x.onclick=()=>loadStreams(x.dataset.getStreams));$$('[data-play-stream]',root).forEach(x=>x.onclick=()=>playStream(state.currentStreams[+x.dataset.playStream]));$$('[data-play-best]',root).forEach(x=>x.onclick=()=>{const s=bestCompatibleStream();if(s)playStream(s)});$$('[data-stream-filter]',root).forEach(x=>x.onclick=()=>{state.streamFilter=x.dataset.streamFilter;renderStreams()});$$('[data-load-more]',root).forEach(x=>x.onclick=()=>{state.discoverVisible+=DISCOVER_BATCH;renderDiscoverPage()});$$('[data-browse-catalog]',root).forEach(x=>x.onclick=()=>{state.discover.catalog=x.dataset.browseCatalog;state.discoverVisible=DISCOVER_BATCH;nav('discover')});$$('[data-season]',root).forEach(x=>x.onclick=()=>{$$('[data-season]',root).forEach(c=>c.classList.toggle('active',c===x));$('#episodeList').innerHTML=episodeHTML(state.currentMeta.videos,x.dataset.season);bindDynamic($('#episodeList'))});$$('[data-action="install"]',root).forEach(x=>x.onclick=installModal);$$('[data-action="settings"]',root).forEach(x=>x.onclick=settingsModal);$$('[data-configure]',root).forEach(x=>x.onclick=()=>{const u=safeUrl(x.dataset.configure);if(u&&/^https?:/i.test(u))window.open(u,'_blank','noopener');else toast('The add-on returned an unsafe configuration link.','bad')});$$('[data-toggle-addon]',root).forEach(x=>x.onclick=async()=>{const a=addonByUrl(x.dataset.toggleAddon);a.enabled=a.enabled===false;store.set('addons',state.addons);state.catalogCache.clear();await loadManifests();renderAddons()});$$('[data-remove-addon]',root).forEach(x=>x.onclick=()=>{const a=addonByUrl(x.dataset.removeAddon);if(!confirm(`Remove ${a.name||'this add-on'}?`))return;state.addons=state.addons.filter(n=>n!==a);state.manifests.delete(a.url);store.set('addons',state.addons);state.catalogCache.clear();renderAddons()});$$('[data-copy]',root).forEach(x=>x.onclick=async()=>{try{await navigator.clipboard.writeText(x.dataset.copy);toast('Copied','good')}catch{toast('Chrome blocked clipboard access.','bad')}});$$('[data-setting]',root).forEach(x=>x.onclick=()=>{const k=x.dataset.setting;state.settings[k]=!state.settings[k];x.classList.toggle('on',state.settings[k])});$$('[data-save-settings]',root).forEach(x=>x.onclick=()=>{state.settings.maxResolution=$('#maxResolution')?.value||'2160p';store.set('settings',state.settings);toast('Settings saved','good');$('#modalRoot').innerHTML=''});$$('[data-export]',root).forEach(x=>x.onclick=exportData);const imp=$('#importFile',root);if(imp)imp.onchange=()=>imp.files[0]&&importData(imp.files[0])}
    function globalEvents(){document.addEventListener('click',e=>{const a=e.target.closest('[data-action="settings"]');if(a)settingsModal()});$('#globalSearch').addEventListener('input',e=>{const q=e.target.value;$('#searchClear').classList.toggle('hidden',!q);clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(q),450)});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);search(e.target.value)}});$('#searchClear').onclick=()=>{$('#globalSearch').value='';$('#searchClear').classList.add('hidden');nav('home')};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').children.length){if($('#mediaEl')||$('#playerStage iframe'))closePlayer();else $('#modalRoot').innerHTML=''}});window.addEventListener('pagehide',()=>progress.flush());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')progress.flush()})}
    async function init(){buildNav();hydrateIcons();bindDynamic();globalEvents();await renderHome()}
    init().catch(e=>{console.error(e);toast('Astra could not start: '+e.message,'bad')});
  })();
  </script>
</body>
</html>
