<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060606">
  <meta name="description" content="Astra — a private, add-on powered streaming client for movies, shows, anime and music.">
  <meta name="color-scheme" content="dark">
  <meta name="astra-release" content="0.32.1">
  <title>Astra</title>
  <script src="assets/js/bootstrap.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/appearance.js?v=__ASTRA_VERSION__"></script>
  <link rel="stylesheet" href="assets/css/obsidian.css?v=__ASTRA_VERSION__">
  <link rel="stylesheet" href="assets/css/cinema.css?v=__ASTRA_VERSION__">
  <style>
    /* Critical shell only: everything else lives in the design system so the
       first paint is never a flash of unstyled bone on white. */
    html{background:var(--cinema-floor,#060606)}
    body{margin:0;background:var(--cinema-floor,#060606);color:#f8f2e8;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Desktop rail. The mobile dock below is the primary one-handed nav. -->
  <aside class="rail" aria-label="Primary">
    <button class="mark" data-nav="home" aria-label="Astra home">A</button>
    <nav class="rail-nav" id="desktopNav" aria-label="Sections"></nav>
    <div class="topbar-spacer"></div>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="wordmark"><span class="brand-orbit" aria-hidden="true">A</span>Astra<span class="brand-edition">CINEMA</span></div>
      <div class="topbar-spacer"></div>
    </header>

    <section class="page active" id="page-home" aria-label="Home"><div id="homeRoot"></div></section>
    <section class="page" id="page-search" aria-label="Search and browse">
      <div class="content">
        <div class="page-head"><h1 class="page-title">Search</h1></div>
        <div class="search-wrap">
          <span data-icon="search"></span>
          <label class="sr-only" for="globalSearch">Search movies, shows, anime, music, and YouTube</label>
          <input class="search" id="globalSearch" type="search" autocomplete="off" placeholder="Movies, shows, anime, music, YouTube">
          <button class="search-clear hidden" id="searchClear" aria-label="Clear search">&times;</button>
        </div>
        <div id="searchRoot"></div>
      </div>
    </section>
    <section class="page" id="page-library" aria-label="Library"><div class="content" id="libraryRoot"></div></section>
    <section class="page" id="page-settings" aria-label="Settings"><div class="content" id="settingsRoot"></div></section>
  </main>

  <nav class="dock" id="mobileNav" aria-label="Primary"></nav>
  <div id="streamOverlayRoot"></div>
  <div id="audioRoot"></div>
  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toastRoot" role="status" aria-live="polite"></div>

  <script src="assets/js/progress-store.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/hub.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/catalog-registry.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/discovery-health.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/federated-search.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/search-intent.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/route-runtime.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/audio-player.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/delivery.js?v=__ASTRA_VERSION__"></script>
<script src="assets/js/playback/source-loader.js?v=__ASTRA_VERSION__"></script>
<script src="assets/js/playback/software-player.js?v=__ASTRA_VERSION__"></script>
<script src="assets/js/playback/settings.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/request-policy.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/video-health.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/diagnostics.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/source-view.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/streams.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/adapters.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/engine.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/episodes.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/playback/subtitles.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/youtube/config.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/youtube/instances.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/youtube/api.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/youtube/playback.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/astra-motion.js?v=__ASTRA_VERSION__"></script>
  <script src="assets/js/app.js?v=__ASTRA_VERSION__"></script>
</body>
</html>
