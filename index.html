<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04050a">
  <meta name="description" content="Astra — a personal, add-on powered streaming client.">
  <meta name="color-scheme" content="dark">
  <title>Astra — Obsidian</title>
  <link rel="stylesheet" href="assets/css/obsidian.css">
  <style>
    /* Critical shell only: everything else lives in the design system so the
       first paint is never a flash of unstyled bone on white. */
    html{background:#04050a}
    body{margin:0;background:#080a11;color:#f4f1ea;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Desktop rail. The mobile dock below is the primary one-handed nav. -->
  <aside class="rail" aria-label="Primary">
    <button class="mark" data-nav="home" aria-label="Astra home"><span data-icon="spark"></span></button>
    <nav class="rail-nav" id="desktopNav" aria-label="Sections"></nav>
    <div class="topbar-spacer"></div>
    <button class="rail-btn" data-action="settings" aria-label="Settings"><span data-icon="settings"></span></button>
  </aside>

  <main id="main">
    <header class="topbar">
      <div class="wordmark">AST<b>R</b>A</div>
      <div class="search-wrap">
        <span data-icon="search"></span>
        <label class="sr-only" for="globalSearch">Search your add-ons</label>
        <input class="search" id="globalSearch" type="search" autocomplete="off" placeholder="Search">
        <button class="search-clear hidden" id="searchClear" aria-label="Clear search">×</button>
      </div>
      <button class="icon-btn" data-action="settings" aria-label="Settings"><span data-icon="settings"></span></button>
    </header>

    <section class="page active" id="page-home" aria-label="Home"><div id="homeRoot"></div></section>
    <section class="page" id="page-hub" aria-label="Media hub"><div class="content" id="hubRoot"></div></section>
    <section class="page" id="page-discover" aria-label="Discover"><div class="content" id="discoverRoot"></div></section>
    <section class="page" id="page-search" aria-label="Search results"><div class="content" id="searchRoot"></div></section>
    <section class="page" id="page-library" aria-label="Library"><div class="content" id="libraryRoot"></div></section>
    <section class="page" id="page-addons" aria-label="Add-ons"><div class="content" id="addonsRoot"></div></section>
  </main>

  <nav class="dock" id="mobileNav" aria-label="Primary"></nav>
  <div id="audioRoot"></div>
  <div id="modalRoot"></div>
  <div class="toast-wrap" id="toastRoot" role="status" aria-live="polite"></div>

  <script src="assets/js/progress-store.js"></script>
  <script src="assets/js/hub.js"></script>
  <script src="assets/js/catalog-registry.js"></script>
  <script src="assets/js/audio-player.js"></script>
  <script src="assets/js/playback/settings.js"></script>
  <script src="assets/js/playback/streams.js"></script>
  <script src="assets/js/playback/adapters.js"></script>
  <script src="assets/js/playback/engine.js"></script>
  <script src="assets/js/playback/episodes.js"></script>
  <script src="assets/js/playback/subtitles.js"></script>
  <script>
  (()=>{'use strict';
    const APP_VERSION='0.11.0',HOME_LIMIT=24,DISCOVER_BATCH=60;
    const DEFAULT_ADDONS=[{url:'https://v3-cinemeta.strem.io/manifest.json',enabled:true,official:true}];
    const KEY='astra.v1.';
    const $=(q,r=document)=>r.querySelector(q), $$=(q,r=document)=>[...r.querySelectorAll(q)];
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const safeUrl=(url)=>{try{const u=new URL(url,location.href);return ['http:','https:','blob:','data:'].includes(u.protocol)?u.href:''}catch{return ''}};
    const storageArea=(()=>{try{const s=globalThis.localStorage;s.getItem(KEY+'probe');return s}catch{return null}})();
    let storageWarned=false;
    function storageFailed(){if(storageWarned)return;storageWarned=true;toast('Device storage is full, so new progress is only kept until this tab closes.','bad')}
    const store={get(k,d){try{return JSON.parse(storageArea?.getItem(KEY+k))??d}catch{return d}},set(k,v){if(!storageArea)return false;try{storageArea.setItem(KEY+k,JSON.stringify(v));return true}catch{storageFailed();return false}}};
    const progress=AstraProgress.createProgressStore({storage:storageArea,storageKey:KEY+'progress',onError:storageFailed}).load();
    const DEFAULT_SETTINGS=AstraPlayback.settings.DEFAULTS;
    const state={addons:store.get('addons',DEFAULT_ADDONS),manifests:new Map(),catalogCache:new Map(),metaCache:new Map(),catalogRegistry:[],homeLayout:store.get('homeLayout',AstraCatalogs.defaults()),currentPage:'home',currentMeta:null,currentVideo:null,currentStreams:[],streamFilter:'all',streamSort:'recommended',homeItems:[],discoverItems:[],discoverVisible:DISCOVER_BATCH,library:store.get('library',{}),settings:AstraPlayback.settings.migrate(store.get('settings',{})),discover:{type:'all',sector:null,sectorLabel:'',addon:'all',catalog:'all',genre:'all'},searchToken:0};

    const icons={home:'<path d="M3 11.5 12 4l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',discover:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',library:'<path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16l-8-4-8 4z"/>',addons:'<path d="M8 3v4H4v4H2v4h2v4h4v2h4v-5h3v-4h5V8h-5V3h-4v5H8V3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21H9.6v-.1A1.7 1.7 0 0 0 8 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 3.6 15a1.7 1.7 0 0 0-1.6-1H2v-4h.1A1.7 1.7 0 0 0 3.6 8a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 8 3.6a1.7 1.7 0 0 0 1.6-1.6V2h4v.1A1.7 1.7 0 0 0 15 3.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 20.4 8a1.7 1.7 0 0 0 1.6 1.6h.1v4H22a1.7 1.7 0 0 0-1.6 1.4z"/>',spark:'<path d="m12 2 2.2 6.1L20 10l-5.8 2L12 18l-2.2-6L4 10l5.8-1.9z"/><path d="m19 17 .8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8z"/>',play:'<path d="m8 5 11 7-11 7z"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9h4M17 9h4M3 15h4M17 15h4"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/>',radio:'<circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',external:'<path d="M14 3h7v7M10 14 21 3"/><path d="M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/>',trash:'<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',download:'<path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/>',upload:'<path d="M12 16V4m0 0 5 5m-5-5L7 9M4 21h16"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',hub:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>',pause:'<path d="M9 5v14M15 5v14"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',minimize:'<path d="m6 9 6 6 6-6"/>',expand:'<path d="m6 15 6-6 6 6"/>',music:'<circle cx="7" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M10 18V6l11-2v12"/>',tv:'<rect x="2" y="7" width="20" height="13" rx="2"/><path d="m8 3 4 4 4-4"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',youtube:'<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/>'};
    function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.film}</svg>`}
    function hydrateIcons(root=document){$$('[data-icon]',root).forEach(e=>e.innerHTML=icon(e.dataset.icon))}
    const navs=[['home','home','Home'],['hub','hub','Hub'],['discover','discover','Discover'],['library','library','Library'],['addons','addons','Add-ons']];
    function buildNav(){
      const dock=navs.map(([id,ic,label])=>`<button class="dock-btn ${id==='home'?'active':''}" data-nav="${id}" aria-label="${label}"><span data-icon="${ic}"></span><span>${label}</span></button>`).join('');
      const rail=navs.map(([id,ic,label])=>`<button class="rail-btn ${id==='home'?'active':''}" data-nav="${id}" aria-label="${label}"><span data-icon="${ic}"></span></button>`).join('');
      $('#desktopNav').innerHTML=rail;$('#mobileNav').innerHTML=dock;
    }
    function toast(msg,type=''){const n=document.createElement('div');n.className='toast '+type;n.innerHTML=`<span data-icon="${type==='bad'?'alert':'spark'}"></span><div>${esc(msg)}</div>`;hydrateIcons(n);const host=$('#toastRoot');host.replaceChildren(n);setTimeout(()=>n.remove(),4600)}
    function normalizeManifestUrl(raw){let s=String(raw||'').trim();if(!s)throw Error('Paste an add-on manifest URL.');if(s.startsWith('stremio://'))s='https://'+s.slice(10);if(!/^https?:\/\//i.test(s))s='https://'+s;const u=new URL(s);if(u.protocol!=='https:'&&u.hostname!=='127.0.0.1'&&u.hostname!=='localhost')throw Error('Remote add-ons must use HTTPS.');if(!u.pathname.endsWith('manifest.json'))u.pathname=u.pathname.replace(/\/$/,'')+'/manifest.json';return u.href}
    function addonBase(url){return url.replace(/\/manifest\.json(?:\?.*)?$/,'')}
    async function fetchJSON(url,timeout=14000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);try{const r=await fetch(url,{mode:'cors',signal:ctrl.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error(`HTTP ${r.status}`);return await r.json()}catch(e){if(e.name==='AbortError')throw Error('Request timed out');throw e}finally{clearTimeout(timer)}}
    function hasResource(m,name,type,id){return (m.resources||[]).some(r=>{if(typeof r==='string')return r===name;if(r.name!==name)return false;if(r.types?.length&&type&&!r.types.includes(type))return false;if(r.idPrefixes?.length&&id&&!r.idPrefixes.some(p=>String(id).startsWith(p)))return false;return true})}
    function endpoint(addon,resource,type,id,extra){const base=addonBase(addon.url),parts=[resource,encodeURIComponent(type),encodeURIComponent(id)];if(extra&&Object.keys(extra).length){const x=Object.entries(extra).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join('&');if(x)parts.push(x)}return `${base}/${parts.join('/')}.json`}
    function addonByUrl(url){return state.addons.find(a=>a.url===url)}
    /* The home page, discover results and hub are all derived from the add-on
       set. When that set changes they are stale by definition, so they are
       dropped and rebuilt rather than left describing the previous world. */
    function invalidateCatalogs(){
      state.catalogCache.clear();
      state.homeItems=[];state.discoverItems=[];state.discoverVisible=DISCOVER_BATCH;
      state.discover={type:'all',sector:null,sectorLabel:'',addon:'all',catalog:'all',genre:'all'};
      const home=$('#homeRoot');if(home)home.innerHTML='';
      if(state.currentPage==='home')renderHome();
      if(state.currentPage==='hub')renderHub();
      if(state.currentPage==='discover')renderDiscover();
    }
    async function loadManifests(force=false){const active=state.addons.filter(a=>a.enabled!==false);await Promise.allSettled(active.map(async a=>{if(!force&&state.manifests.has(a.url))return;try{const m=await fetchJSON(a.url);if(!m.id||!m.name)throw Error('Invalid manifest');state.manifests.set(a.url,m);a.error='';a.name=m.name;a.logo=m.logo||''}catch(e){a.error=e.message;state.manifests.delete(a.url)}}));store.set('addons',state.addons)}
    function manifests(){return state.addons.filter(a=>a.enabled!==false&&state.manifests.has(a.url)).map(a=>({addon:a,manifest:state.manifests.get(a.url)}))}
    async function installAddon(raw){const url=normalizeManifestUrl(raw);if(addonByUrl(url))throw Error('That add-on is already installed.');const m=await fetchJSON(url);if(!m.id||!m.name||!Array.isArray(m.resources))throw Error('The URL did not return a valid Stremio manifest.');state.addons.push({url,enabled:true,name:m.name,logo:m.logo||'',official:false});state.manifests.set(url,m);store.set('addons',state.addons);toast(`${m.name} installed`,'good');invalidateCatalogs();renderAddons();return m}
    function mediaKey(m){return AstraCatalogs.contentKey(m)}
    function mediaRef(m){return AstraCatalogs.mediaRef(m)}
    function refreshCatalogRegistry(){state.catalogRegistry=AstraCatalogs.build(manifests(),{includeAdult:state.settings.showAdult});state.homeLayout=AstraCatalogs.reconcile(state.catalogRegistry,state.homeLayout);store.set('homeLayout',state.homeLayout);return state.catalogRegistry}
    function catalogEntries(visibleOnly=false){const entries=refreshCatalogRegistry();return AstraCatalogs.ordered(entries,state.homeLayout,visibleOnly)}
    function recordMeta(m,source,cat){const item={...m,_addonUrl:source?.addon?.url||m._addonUrl,_addonName:source?.manifest?.name||m._addonName,_providerKey:source?AstraCatalogs.providerKey(source):m._providerKey,_catalogKey:source&&cat?AstraCatalogs.catalogKey(source,cat):m._catalogKey};const ref=mediaRef(item),key=mediaKey(item);if(ref)state.metaCache.set(ref,item);if(key&&!state.metaCache.has(key))state.metaCache.set(key,item);return item}
    async function getCatalog(source,cat,extra={}){const key=source.addon.url+'|'+cat.type+'|'+cat.id+'|'+JSON.stringify(extra);if(state.catalogCache.has(key))return state.catalogCache.get(key);const p=fetchJSON(endpoint(source.addon,'catalog',cat.type,cat.id,extra)).then(d=>(d.metas||[]).map(x=>recordMeta({...x,type:x.type||cat.type},source,cat))).catch(e=>{state.catalogCache.delete(key);throw e});state.catalogCache.set(key,p);return p}
    function catalogExtras(cat,overrides={}){const out={};for(const e of cat.extra||[]){if(e.isRequired&&e.name!=='search'&&e.name!=='skip'&&e.options?.length)out[e.name]=e.options[0]}return {...out,...overrides}}
    function yearOf(m){return m.releaseInfo||m.year||(m.released?String(m.released).slice(0,4):'')}
    function audioLanguageChoices(current){const choices=[['original','Original / source default'],['ja','Japanese'],['en','English'],['es','Spanish'],['fr','French'],['de','German'],['pt','Portuguese'],['it','Italian'],['ko','Korean'],['zh','Chinese']],value=String(current||'original').toLowerCase();if(value&&!choices.some(([id])=>id===value))choices.push([value,value.toUpperCase()]);return choices}
    function poster(m){return safeUrl(m.poster||m.background||m.logo||'')}
    function backdrop(m){return safeUrl(m.background||m.poster||'')}
    /* Artwork keeps its measured box while it loads, then crossfades in. The
       fallback remains underneath, so a slow or broken provider never leaves
       a blank card or causes the rail to jump. */
    function mediaImage(url,options={}){
      if(!url)return '';
      const priority=options.priority?'fetchpriority="high"':'loading="lazy"';
      return `<span class="art-loader" aria-hidden="true"></span><img class="media-image" ${priority} decoding="async" src="${esc(url)}" alt="" onload="this.parentElement.classList.add('image-ready')" onerror="this.parentElement.classList.add('image-error');this.remove()">`;
    }
    function progressEntries(m){return progress.entriesFor(mediaKey(m))}
    function latestProgress(m){return progress.latest(mediaKey(m))}
    function videoProgress(m,videoId){return progress.get(mediaKey(m),videoId)}
    function cardHTML(m,index=0){
      const p=poster(m),prog=latestProgress(m),source=m._addonName||'',watched=m.type!=='series'&&prog?.completed;
      const pct=prog?.duration?Math.min(100,prog.time/prog.duration*100):0;
      const meta=[yearOf(m),typeLabel(m.type)].filter(Boolean).join(' · ');
      return `<button class="card" style="--card-index:${Math.min(Number(index)||0,10)}" data-open="${esc(mediaRef(m))}" aria-label="Open ${esc(m.name||m.title||'title')} from ${esc(source||'this provider')}">
        <span class="art ${p?'image-loading':'image-error'}">${mediaImage(p)}
          <span class="art-fallback">${icon(m.type==='channel'||m.type==='radio'?'radio':'film')}</span>
          ${source?`<span class="art-source">${esc(source)}</span>`:''}
          ${watched?`<span class="art-watched">${icon('check')}</span>`:''}
          ${pct>0&&!watched?`<span class="art-progress"><i style="width:${pct}%"></i></span>`:''}
        </span>
        <span class="card-title">${esc(m.name||m.title||'Untitled')}</span>
        <span class="card-meta">${esc(meta||'\u00a0')}</span></button>`;
    }
    /* A human label for a raw add-on type, so "tv_channel" never reaches the UI. */
    function typeLabel(type){return AstraHub.typeLabel(type)}
    /* One state frame for empty, error and offline, so every dead end in the
       app explains itself and offers the same shape of way forward. */
    function stateHTML(title,text,action='',kind=''){
      const glyph=kind==='error'?'alert':kind==='offline'?'globe':'film';
      return `<div class="state ${kind}"><div class="state-icon">${icon(glyph)}</div><h3>${esc(title)}</h3><p>${esc(text)}</p>${action}</div>`;
    }
    function emptyHTML(title,text,action=''){return stateHTML(title,text,action)}
    function skeletonRail(){return `<div class="rail-scroll" aria-hidden="true">${Array.from({length:6},()=>'<div><div class="skeleton skeleton-art"></div><div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line" style="width:60%"></div></div>').join('')}</div>`}
    function skeletonSector(title){return `<section class="sector"><div class="sector-head"><span class="numeral sector-index">--</span><h2 class="sector-title">${esc(title)}</h2></div>${skeletonRail()}</section>`}
    function nav(page){
      state.currentPage=page;
      $$('.page').forEach(x=>x.classList.toggle('active',x.id===`page-${page}`));
      $$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));
      if(page==='hub')renderHub();
      if(page==='discover')renderDiscover();
      if(page==='library')renderLibrary();
      if(page==='addons')renderAddons();
      if(page==='home'&&!$('#homeRoot').children.length)renderHome();
      window.scrollTo({top:0,behavior:motionOk()?'smooth':'auto'});
    }
    /* The editorial home: one commanding feature, then sectors generated from
       whatever the installed add-ons actually expose. Skeletons occupy the
       final layout so nothing shifts when the real data lands. */
    async function renderHome(){
      const root=$('#homeRoot');
      root.innerHTML=`<div id="featureMount"></div><div class="content" id="homeSections">${skeletonSector('Loading')}${skeletonSector('Loading')}</div>`;
      const sections=$('#homeSections');
      await loadManifests();
      const jobs=catalogEntries(true).map(entry=>({s:entry.source,cat:entry.catalog,entry}));
      if(!jobs.length){
        $('#featureMount').innerHTML=welcomeFeatureHTML();
        sections.innerHTML=stateHTML('No catalogs yet','Astra shows only what your installed add-ons expose. Install one to populate the home screen.',`<button class="btn btn-primary" data-nav="addons">${icon('plus')} Add an add-on</button>`);
        bindDynamic(root);return;
      }
      const results=await Promise.allSettled(jobs.slice(0,24).map(async j=>({...j,items:await getCatalog(j.s,j.cat,catalogExtras(j.cat))})));
      const good=results.filter(x=>x.status==='fulfilled'&&x.value.items.length).map(x=>x.value);
      state.homeItems=good.flatMap(x=>x.items);
      if(!good.length){
        $('#featureMount').innerHTML=welcomeFeatureHTML();
        sections.innerHTML=stateHTML('Catalogs could not load','No installed add-on returned a catalog. Check your connection, or that each add-on still has a valid configured manifest URL.',`<button class="btn btn-primary" data-nav="addons">Manage add-ons</button>`,'error');
        bindDynamic(root);return;
      }
      const heroGroups=good.filter(x=>x.entry.hero),featured=(heroGroups.length?heroGroups:good).flatMap(x=>x.items).find(x=>backdrop(x))||good[0].items[0];
      $('#featureMount').innerHTML=state.homeLayout.showHero?featureHTML(featured):'';
      sections.innerHTML='';
      let index=0;
      const cont=continueItems();
      if(cont.length)sections.insertAdjacentHTML('beforeend',resumeSectionHTML(++index,cont));
      /* New releases lead with the catalog's own naming so the release/source
         name stays legible enough to judge quality before opening anything. */
      const fresh=good.find(x=>/new|latest|recent|release/i.test(x.cat.name||x.cat.id||''));
      if(fresh)sections.insertAdjacentHTML('beforeend',releaseSectionHTML(++index,fresh));
      good.filter(x=>x!==fresh).forEach(({s,cat,entry,items})=>{
        const note=[state.homeLayout.showProvider?s.manifest.name:'',state.homeLayout.showType?typeLabel(cat.type):''].filter(Boolean).join(' · ');
        sections.insertAdjacentHTML('beforeend',railSection(entry.displayName,items,note,entry.key,++index));
      });
      bindDynamic(root);
    }
    function featureHTML(m){
      if(!m)return welcomeFeatureHTML();
      const b=backdrop(m),saved=!!state.library[mediaKey(m)];
      const facts=[yearOf(m),typeLabel(m.type),m.runtime,m.imdbRating?`★ ${m.imdbRating}`:'',m._addonName].filter(Boolean);
      return `<section class="feature" aria-label="Featured">
        <div class="feature-art ${b?'image-loading':'image-error'}">${mediaImage(b,{priority:true})}
          <span class="feature-orbit" aria-hidden="true"><i></i></span>
          <span class="feature-coordinate mono" aria-hidden="true">ASTRA // ${esc(String(m.type||'media').toUpperCase())}</span>
        </div>
        <div class="feature-body">

="Automatic failover" aria-pressed="${s.autoFailover}"><i></i></button></div><div class="field"><label for="audioLanguage">Preferred audio</label><select class="select" id="audioLanguage" style="width:100%">${audioLanguageChoices(s.audioLanguage).map(([v,l])=>`<option ${s.audioLanguage===v?'selected':''} value="${v}">${l}</option>`).join('')}</select><small>Applied when HLS or DASH exposes selectable tracks. Direct files depend on Android Chrome.</small></div><div class="field"><label for="subtitleLanguage">Preferred subtitle language</label><select class="select" id="subtitleLanguage" style="width:100%">${[['en','English'],['es','Spanish'],['fr','French'],['de','German'],['pt','Portuguese'],['it','Italian'],['nl','Dutch'],['sv','Swedish'],['pl','Polish'],['ru','Russian'],['ja','Japanese'],['ko','Korean'],['zh','Chinese'],['ar','Arabic'],['hi','Hindi']].map(([v,l])=>`<option ${s.subtitleLanguage===v?'selected':''} value="${v}">${l}</option>`).join('')}</select></div><div class="switch-row"><div><b>Subtitles on by default</b><span>Turn on your preferred language whenever a matching track exists.</span></div><button class="switch ${s.subtitlesDefault?'on':''}" data-setting="subtitlesDefault" aria-label="Subtitles on by default" aria-pressed="${s.subtitlesDefault}"><i></i></button></div><div class="switch-row"><div><b>Show adult catalogs</b><span>Show add-ons or catalogs that explicitly mark themselves as adult.</span></div><button class="switch ${s.showAdult?'on':''}" data-setting="showAdult" aria-label="Show adult catalogs" aria-pressed="${s.showAdult}"><i></i></button></div><div class="notice warn" style="margin-top:20px">Exports include configured add-on URLs, which may contain private service tokens. Keep backup files private.</div><div class="actions" style="margin-top:22px"><button class="btn btn-primary" data-save-settings>Save settings</button><button class="btn btn-ghost" data-export>${icon('download')} Private backup</button><label class="btn btn-ghost">${icon('upload')} Import backup<input class="hidden" id="importFile" type="file" accept="application/json"></label></div><p class="muted" style="font-size:11px;margin-top:24px">Astra ${APP_VERSION} · Your add-ons, library, settings, and progress are stored locally in Chrome.</p></div></section></div>`;bindDynamic($('#modalRoot'))}
    function exportData(){const data={app:'Astra',version:APP_VERSION,exported:new Date().toISOString(),addons:state.addons,library:state.library,progress:progress.snapshot(),settings:state.settings,homeLayout:state.homeLayout};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='astra-backup.json';a.click();URL.revokeObjectURL(a.href)}
    async function importData(file){const owned=currentModal();try{const d=JSON.parse(await file.text());if(d.app!=='Astra'||!Array.isArray(d.addons))throw Error('Not an Astra backup');state.addons=d.addons;state.library=d.library||{};progress.replace(d.progress||{});state.settings=AstraPlayback.settings.migrate({...state.settings,...d.settings});state.homeLayout=d.homeLayout&&typeof d.homeLayout==='object'?d.homeLayout:AstraCatalogs.defaults();for(const k of ['addons','library','settings','homeLayout'])store.set(k,state[k]);state.manifests.clear();state.catalogCache.clear();await loadManifests(true);toast('Backup imported','good');if(currentModal()===owned)closeModal();invalidateCatalogs();renderHome()}catch(e){toast(`Import failed: ${e.message}`,'bad')}}
    function bindDynamic(root=document){hydrateIcons(root);$$('[data-nav]',root).forEach(x=>x.onclick=()=>{if(root!==document)closeModal();nav(x.dataset.nav)});$$('[data-close]',root).forEach(x=>x.onclick=()=>closeModal());$$('[data-close-player]',root).forEach(x=>x.onclick=()=>closePlayer());$$('[data-dismiss]',root).forEach(x=>x.onclick=e=>{if(e.target===x)closeModal()});$$('[data-open]',root).forEach(x=>x.onclick=()=>openMedia(x.dataset.open));$$('[data-library]',root).forEach(x=>x.onclick=()=>toggleLibrary(x.dataset.library));$$('[data-get-streams]',root).forEach(x=>x.onclick=()=>loadStreams(x.dataset.getStreams));$$('[data-play-source]',root).forEach(x=>x.onclick=()=>openPlayer(entryById(x.dataset.playSource)));$$('[data-play-best]',root).forEach(x=>x.onclick=()=>{const best=AstraPlayback.streams.bestCandidate(player.ranked);if(best)openPlayer(best)});$$('[data-stream-filter]',root).forEach(x=>x.onclick=()=>{state.streamFilter=x.dataset.streamFilter;renderStreams()});$$('[data-stream-sort]',root).forEach(x=>x.onchange=()=>{state.streamSort=x.value;renderStreams()});$$('[data-player-action]',root).forEach(x=>x.onclick=()=>playerAction(x.dataset.playerAction));$$('[data-episode-nav]',root).forEach(x=>x.onclick=()=>{const dir=x.dataset.episodeNav,m=player.meta;if(!m)return;const target=dir==='next'?AstraPlayback.episodes.nextEpisode(m.videos,player.video.id):AstraPlayback.episodes.previousEpisode(m.videos,player.video.id);if(target)goToEpisode(target)});$$('[data-countdown]',root).forEach(x=>x.onclick=()=>{if(x.dataset.countdown==='cancel')cancelCountdown();else if(player.countdown)player.countdown.finishNow()});$$('[data-track-menu]',root).forEach(x=>x.onclick=()=>{if(player.menu===x.dataset.trackMenu)closeTrackMenu();else openTrackMenu(x.dataset.trackMenu)});$$('[data-text-track]',root).forEach(x=>x.onclick=()=>selectSubtitle(x.dataset.textTrack));$$('[data-audio-track]',root).forEach(x=>x.onclick=()=>selectAudioTrack(x.dataset.audioTrack));$$('[data-load-more]',root).forEach(x=>x.onclick=()=>{state.discoverVisible+=DISCOVER_BATCH;renderDiscoverPage()});$$('[data-hub-open]',root).forEach(x=>x.onclick=()=>openHubSector(x.dataset.hubOpen));$$('[data-browse-catalog]',root).forEach(x=>x.onclick=()=>{state.discover.catalog=x.dataset.browseCatalog;state.discoverVisible=DISCOVER_BATCH;nav('discover')});$$('[data-season]',root).forEach(x=>x.onclick=()=>{$$('[data-season]',root).forEach(c=>{const selected=c===x;c.classList.toggle('active',selected);c.setAttribute('aria-selected',String(selected));c.tabIndex=selected?0:-1});$('#episodeList').innerHTML=episodeHTML(state.currentMeta.videos,x.dataset.season);bindDynamic($('#episodeList'))});$$('[data-action="install"]',root).forEach(x=>x.onclick=installModal);$$('[data-action="settings"]',root).forEach(x=>x.onclick=settingsModal);$$('[data-configure]',root).forEach(x=>x.onclick=()=>{const u=safeUrl(x.dataset.configure);if(u&&/^https?:/i.test(u))window.open(u,'_blank','noopener');else toast('The add-on returned an unsafe configuration link.','bad')});$$('[data-toggle-addon]',root).forEach(x=>x.onclick=async()=>{const a=addonByUrl(x.dataset.toggleAddon);a.enabled=a.enabled===false;store.set('addons',state.addons);await loadManifests();invalidateCatalogs();renderAddons()});$$('[data-remove-addon]',root).forEach(x=>x.onclick=()=>{const a=addonByUrl(x.dataset.removeAddon);if(!confirm(`Remove ${a.name||'this add-on'}?`))return;state.addons=state.addons.filter(n=>n!==a);state.manifests.delete(a.url);store.set('addons',state.addons);invalidateCatalogs();renderAddons()});$$('[data-copy]',root).forEach(x=>x.onclick=async()=>{try{await navigator.clipboard.writeText(x.dataset.copy);toast('Copied','good')}catch{toast('Chrome blocked clipboard access.','bad')}});$$('[data-setting]',root).forEach(x=>x.onclick=()=>{const k=x.dataset.setting;state.settings[k]=!state.settings[k];x.classList.toggle('on',state.settings[k]);x.setAttribute('aria-pressed',String(state.settings[k]))});$$('[data-save-settings]',root).forEach(x=>x.onclick=()=>{state.settings.maxResolution=$('#maxResolution')?.value||'2160p';state.settings.hdrPreference=$('#hdrPreference')?.value||'neutral';state.settings.audioLanguage=$('#audioLanguage')?.value||'original';state.settings.subtitleLanguage=$('#subtitleLanguage')?.value||'en';state.settings=AstraPlayback.settings.migrate(state.settings);store.set('settings',state.settings);toast('Settings saved','good');closeModal()});$$('[data-export]',root).forEach(x=>x.onclick=exportData);const imp=$('#importFile',root);if(imp)imp.onchange=()=>imp.files[0]&&importData(imp.files[0])}
    function globalEvents(){document.addEventListener('click',e=>{const a=e.target.closest('[data-action="settings"]');if(a)settingsModal()});$('#globalSearch').addEventListener('input',e=>{const q=e.target.value;$('#searchClear').classList.toggle('hidden',!q);clearTimeout(searchTimer);searchTimer=setTimeout(()=>search(q),450)});$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(searchTimer);search(e.target.value)}});$('#searchClear').onclick=()=>{$('#globalSearch').value='';$('#searchClear').classList.add('hidden');nav('home')};document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#trackMenu')){closeTrackMenu();return}if($('#countdownCard')){cancelCountdown();return}if($('#modalRoot').children.length){if($('#mediaEl')||$('#playerStage iframe'))closePlayer();else closeModal()}});window.addEventListener('pagehide',()=>progress.flush());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')progress.flush()})}
    function applyHomeLayout(next,message){state.homeLayout=AstraCatalogs.reconcile(state.catalogRegistry,next);store.set('homeLayout',state.homeLayout);const home=$('#homeRoot');if(home)home.innerHTML='';if(state.currentPage==='home')renderHome();if(message)toast(message,'good')}
    async function homeLayoutModal(){
      await loadManifests();
      const entries=catalogEntries(false),ordered=AstraCatalogs.ordered(entries,state.homeLayout,false),visible=ordered.filter(x=>x.visible).length,heroes=ordered.filter(x=>x.hero).length;
      const rows=ordered.map((entry,index)=>`<article class="layout-catalog ${entry.visible?'':'is-hidden'}">
        <div class="layout-catalog-copy"><b>${esc(entry.displayName)}</b><span>${esc(entry.providerName)} · ${esc(typeLabel(entry.type))}</span></div>
        <button class="hero-pick ${entry.hero?'active':''}" data-layout-hero="${esc(entry.key)}" aria-pressed="${entry.hero}" aria-label="${entry.hero?'Remove from':'Add to'} hero rotation">${icon('spark')}</button>
        <button class="switch ${entry.visible?'on':''}" data-layout-visible="${esc(entry.key)}" aria-pressed="${entry.visible}" aria-label="${entry.visible?'Hide':'Show'} ${esc(entry.displayName)}"><i></i></button>
        <div class="layout-order" aria-label="Reorder ${esc(entry.displayName)}"><button data-layout-move="${esc(entry.key)}" data-delta="-1" ${index===0?'disabled':''} aria-label="Move up">↑</button><button data-layout-move="${esc(entry.key)}" data-delta="1" ${index===ordered.length-1?'disabled':''} aria-label="Move down">↓</button></div>
      </article>`).join('');
      $('#modalRoot').innerHTML=`<div class="modal-shell" data-dismiss><section class="modal layout-modal" role="dialog" aria-modal="true" aria-labelledby="layoutTitle"><div class="modal-head"><button class="icon-btn" data-layout-back aria-label="Back to settings">←</button><div><span class="label">Personalize</span><h2 id="layoutTitle">Home layout</h2></div><button class="icon-btn" data-close aria-label="Close settings">${icon('close')}</button></div><div class="modal-body">
        <div class="layout-summary"><b>Keep Home focused.</b><span>${visible} of ${ordered.length} catalogs visible · ${heroes} hero source${heroes===1?'':'s'}</span><p>Every row keeps its provider identity. Reorder or hide catalogs without changing the add-ons themselves.</p></div>
        <div class="settings-group"><div class="switch-row"><div><b>Show hero</b><span>Use selected catalogs for the cinematic lead story.</span></div><button class="switch ${state.homeLayout.showHero?'on':''}" data-layout-option="showHero" aria-label="Show hero" aria-pressed="${state.homeLayout.showHero}"><i></i></button></div><div class="switch-row"><div><b>Show provider names</b><span>Keep overlapping add-on catalogs easy to identify.</span></div><button class="switch ${state.homeLayout.showProvider?'on':''}" data-layout-option="showProvider" aria-label="Show provider names" aria-pressed="${state.homeLayout.showProvider}"><i></i></button></div><div class="switch-row"><div><b>Show media type</b><span>Label Movie, Series, TV, Radio, and custom rows.</span></div><button class="switch ${state.homeLayout.showType?'on':''}" data-layout-option="showType" aria-label="Show media type" aria-pressed="${state.homeLayout.showType}"><i></i></button></div></div>
        <div class="layout-section-head"><span class="label">Catalogs</span><button data-layout-reset>Reset</button></div>${rows||stateHTML('No catalogs available','Install or enable an add-on to configure Home.','<button class="btn btn-primary" data-nav="addons">Manage add-ons</button>')}
      </div></section></div>`;
      bindDynamic($('#modalRoot'));
      $$('[data-layout-visible]').forEach(button=>button.onclick=()=>{const key=button.dataset.layoutVisible,current=state.homeLayout.catalogs[key];applyHomeLayout(AstraCatalogs.setCatalog(state.homeLayout,key,{visible:current.visible===false}));homeLayoutModal()});
      $$('[data-layout-hero]').forEach(button=>button.onclick=()=>{const key=button.dataset.layoutHero,current=state.homeLayout.catalogs[key];applyHomeLayout(AstraCatalogs.setCatalog(state.homeLayout,key,{hero:!current.hero}));homeLayoutModal()});
      $$('[data-layout-move]').forEach(button=>button.onclick=()=>{applyHomeLayout(AstraCatalogs.move(state.homeLayout,button.dataset.layoutMove,Number(button.dataset.delta)));homeLayoutModal()});
      $$('[data-layout-option]').forEach(button=>button.onclick=()=>{const next={...state.homeLayout,[button.dataset.layoutOption]:!state.homeLayout[button.dataset.layoutOption]};applyHomeLayout(next);homeLayoutModal()});
      $('[data-layout-reset]')?.addEventListener('click',()=>{applyHomeLayout(AstraCatalogs.reconcile(entries,AstraCatalogs.defaults()),'Home layout reset');homeLayoutModal()});
      $('[data-layout-back]')?.addEventListener('click',()=>settingsModal());
    }
    function enhanceSettings(){const playbackSettings=settingsModal;settingsModal=()=>{playbackSettings();const body=$('.modal-body',$('#modalRoot'));if(!body)return;body.insertAdjacentHTML('afterbegin',`<button class="settings-route" data-home-layout><span class="settings-route-icon">${icon('home')}</span><span><b>Home layout</b><small>Catalog order, visibility, hero sources, and provider labels</small></span><span aria-hidden="true">›</span></button><div class="settings-divider"><span>Playback</span></div>`);$('[data-home-layout]',body).onclick=homeLayoutModal;hydrateIcons(body)}}
    async function init(){enhanceSettings();buildNav();hydrateIcons();bindDynamic();globalEvents();await renderHome()}
    init().catch(e=>{console.error(e);toast('Astra could not start: '+e.message,'bad')});
  })();
  </script>
