name: Deploy verified music Worker

on:
  workflow_dispatch:
    inputs:
      makima_inspect_only:
        description: 'Read-only Makima active version, handler presence and secret NAMES; no values or writes'
        required: false
        type: boolean
        default: false
      verify_lucy_discovery_only:
        description: 'Read-only: reconcile the pinned Lucy discovery settings checkpoint; no deployment'
        required: false
        type: boolean
        default: false
      source_commit:
        description: 'Exact tested Jarvis source commit (40-character SHA)'
        required: true
        type: string
      confirm_public_music:
        description: 'Approved: bind jarvis-music and deploy public-by-link read-only music delivery'
        required: true
        type: boolean
        default: false
      partial_report_run_id:
        description: 'Completed migration run whose verified R2 subset should be published (blank = no map change)'
        required: false
        type: string
        default: ''
      native_upload_setup:
        description: 'Approved: initialize independent R2 library and test limited signed native uploads (no Google downloads)'
        required: false
        type: boolean
        default: false
      muse_public_key:
        description: 'Optional NONSECRET raw Ed25519 public key, 64 lowercase hex; blank leaves Muse uploads disabled'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: jarvis-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_public_music == true && inputs.verify_lucy_discovery_only != true && inputs.makima_inspect_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require an immutable source revision
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          if ! [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'An exact 40-character Jarvis commit is required' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: ${{ inputs.source_commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Verify the checkout and run regression tests without deployment secrets
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git -C .jarvis-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -f .jarvis-source/tests/music-delivery.test.js
          npm --prefix .jarvis-source ci
          npm --prefix .jarvis-source test
          node --test tests/music-worker-workflow.test.mjs
          node scripts/prepare-music-worker.mjs .jarvis-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test migration and partial publication without credentials
        run: python -m unittest discover -s .jarvis-source/tests -p 'test_r2*.py'
      - name: Prepare native library and temporary upload verification key
        if: ${{ inputs.native_upload_setup == true }}
        env:
          MUSE_PUBLIC_KEY: ${{ inputs.muse_public_key }}
        run: |
          test -f .jarvis-source/tests/native-r2.test.js
          node .jarvis-source/scripts/build-r2-library.mjs r2-library-seed.json
          node --input-type=module <<'JS'
          import {generateKeyPairSync} from 'node:crypto';
          import {writeFileSync} from 'node:fs';
          const muse=process.env.MUSE_PUBLIC_KEY;
          if(muse && !/^[a-f0-9]{64}$/.test(muse))throw Error('Only a nonsecret raw Ed25519 public key is accepted');
          const keys=generateKeyPairSync('ed25519');
          writeFileSync('.jarvis-source/.music-test-key.pem',keys.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o600});
          const publicKey=keys.publicKey.export({type:'spki',format:'der'}).subarray(-32).toString('hex');
          writeFileSync('.music-upload-keys.json',JSON.stringify([...(muse?[muse]:[]),publicKey]));
          JS
          node scripts/prepare-music-worker.mjs .jarvis-source .music-upload-keys.json
      - name: Install native publication and uploader dependencies
        if: ${{ inputs.native_upload_setup == true }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3>=1.35,<2' 'mutagen==1.48.1'
      - name: Initialize independent library without overwriting an existing library
        if: ${{ inputs.native_upload_setup == true }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/manage-r2-library.py seed r2-library-seed.json > r2-library-seed-report.json
      - name: Resolve one completed migration report from this repository
        if: ${{ inputs.partial_report_run_id != '' }}
        id: report
        uses: actions/github-script@v7
        env:
          REPORT_RUN_ID: ${{ inputs.partial_report_run_id }}
        with:
          script: |
            const id = process.env.REPORT_RUN_ID;
            if (!/^[1-9][0-9]{0,14}$/.test(id)) throw Error('A numeric report run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
            if (run.status !== 'completed' || run.path !== '.github/workflows/migrate-music-r2.yml' ||
                run.repository.full_name !== 'braydenparker000/Missionarytube-') throw Error('Unexpected or unfinished migration run');
            const name = `r2-migration-report-${id}-${run.run_attempt}`;
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: Number(id)});
            const matches = data.artifacts.filter(a => a.name === name && !a.expired);
            if (matches.length !== 1) throw Error('Exactly one retained report artifact is required');
            core.setOutput('name', name);
      - name: Download saved report artifact
        if: ${{ inputs.partial_report_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.partial_report_run_id }}
          name: ${{ steps.report.outputs.name }}
          path: .partial-report
      - name: Install R2 publication client
        if: ${{ inputs.partial_report_run_id != '' }}
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3>=1.35,<2'
      - name: Publish partial map by reading and hashing R2 only
        if: ${{ inputs.partial_report_run_id != '' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: jarvis-music
          MUSIC_ROOT_ID: 1VlEUztloW5saoM7iF11fodDKSmCGP2ZZ
        run: python .jarvis-source/scripts/publish-r2-partial.py --report .partial-report/r2-migration-report.json --output r2-partial-playback-report.json
      - name: Check current Worker bindings before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/check-music-worker-bindings.mjs
      - name: Record current Worker versions for rollback and deploy
        id: worker_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: .jarvis-source
          preCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-before.json
          command: deploy --config backend/wrangler.music.generated.json
          postCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-after.json
      - name: Verify real signed native upload, artwork, hashes, decode, Range and CORS
        if: ${{ inputs.native_upload_setup == true }}
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python scripts/music-upload-canary.py
          node scripts/assert-music-upload-revoked.mjs --enabled
          python .jarvis-source/scripts/upload-music-r2.py music-verification/native/canary.opus --key .jarvis-source/.music-test-key.pem --report music-verification/native/upload.json
          node scripts/verify-native-upload.mjs
      - name: Verify the newly uploaded song in the exact deployed mobile player
        if: ${{ inputs.native_upload_setup == true }}
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          npm ci
          chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome_path"
          export MUSIC_BROWSER_EXECUTABLE="$chrome_path"
          node scripts/verify-native-upload-browser.mjs
      - name: Remove only this run's generated verification song and blobs
        if: ${{ always() && inputs.native_upload_setup == true && steps.worker_deploy.outcome == 'success' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if test -f music-verification/native/upload.json; then
            python scripts/manage-r2-library.py cleanup music-verification/native/upload.json > r2-canary-cleanup-report.json
          fi
      - name: Revoke temporary verification key and retain only explicitly registered Muse public key
        if: ${{ always() && inputs.native_upload_setup == true && steps.worker_deploy.outcome == 'success' }}
        env:
          MUSE_PUBLIC_KEY: ${{ inputs.muse_public_key }}
        run: |
          cp .jarvis-source/worker-versions-after.json .jarvis-source/worker-versions-canary.json
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const key=process.env.MUSE_PUBLIC_KEY;
          if(key && !/^[a-f0-9]{64}$/.test(key))throw Error('Invalid public key');
          writeFileSync('.music-upload-keys.json',JSON.stringify(key?[key]:[]));
          JS
          node scripts/prepare-music-worker.mjs .jarvis-source .music-upload-keys.json
      - name: Deploy final Worker with temporary upload access revoked
        if: ${{ always() && inputs.native_upload_setup == true && steps.worker_deploy.outcome == 'success' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: .jarvis-source
          command: deploy --config backend/wrangler.music.generated.json
          postCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-after.json
      - name: Require live rejection of the revoked temporary upload key
        if: ${{ always() && inputs.native_upload_setup == true && steps.worker_deploy.outcome == 'success' }}
        run: node scripts/assert-music-upload-revoked.mjs
      - name: Delete temporary private signing material
        if: always()
        run: rm -f .jarvis-source/.music-test-key.pem
      - name: Verify live music bytes, decoding, Range, CORS and catalog matching
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          node scripts/verify-music-worker.mjs ${{ inputs.partial_report_run_id != '' && 'r2-partial-playback-report.json' || '' }}
      - name: Preserve deployment checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-checkpoint-${{ github.run_id }}
          path: |
            .jarvis-source/worker-versions-before.json
            .jarvis-source/worker-versions-after.json
            .jarvis-source/worker-versions-canary.json
            .jarvis-source/backend/wrangler.music.generated.json
            worker-bindings-before.json
            r2-partial-playback-report.json
            music-verification/report.json
            music-verification/native/upload.json
            music-verification/native/proof.json
            music-verification/native/browser/
            r2-library-seed-report.json
            r2-canary-cleanup-report.json
          if-no-files-found: warn
          retention-days: 30
  verify-lucy-discovery:
    if: ${{ github.ref == 'refs/heads/main' && inputs.verify_lucy_discovery_only == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the bounded read-only request
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CONFIRM_PUBLIC_MUSIC: ${{ inputs.confirm_public_music }}
          NATIVE_UPLOAD_SETUP: ${{ inputs.native_upload_setup }}
          PARTIAL_REPORT: ${{ inputs.partial_report_run_id }}
          MUSE_PUBLIC_KEY: ${{ inputs.muse_public_key }}
        run: |
          test "$SOURCE_COMMIT" = c28c1b2f70aabb5217b08bf31ffe4c93d0353765
          test "$CONFIRM_PUBLIC_MUSIC" = false
          test "$NATIVE_UPLOAD_SETUP" != true
          test -z "$PARTIAL_REPORT"
          test -z "$MUSE_PUBLIC_KEY"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Verify the exact failed production checkpoint provenance
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = 38165680255;
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (run.head_sha !== '5425b86e9661665dea5d06c0c616385a23d6c7a6' || run.run_attempt !== 1 ||
                run.event !== 'push' || run.head_branch !== 'main' || run.status !== 'completed' || run.conclusion !== 'failure' ||
                run.path !== '.github/workflows/deploy-azure-storage.yml' || run.repository.full_name !== 'braydenparker000/Missionarytube-')
              throw Error('Unexpected diagnostic checkpoint run');
            const {data} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id});
            const artifacts = data.artifacts.filter(a => a.name === 'podcast-worker-38165680255' && !a.expired);
            if (artifacts.length !== 1 || artifacts[0].id !== 11712500345 ||
                artifacts[0].digest !== 'sha256:fc35e7b6dc914ac34543ef5e3f511a3f3829ac2635a28015f4e9299867e354f9')
              throw Error('Unexpected diagnostic checkpoint artifact');
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38165680255
          name: podcast-worker-38165680255
          path: .lucy-diagnostic-checkpoint
      - name: Read and reconcile live settings without mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/lucy-settings-diagnostic.mjs

  makima-inspect:
    if: ${{ inputs.makima_inspect_only == true && inputs.confirm_public_music != true && github.actor_id == '183016859' && github.triggering_actor == 'braydenparker999' && inputs.source_commit == '099ec1a0b2b621a3799f4f8346490903f212a912' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Test redaction and fixed read-only provider requests before credentials
        run: node --test scripts/makima-provider-inspect.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: 099ec1a0b2b621a3799f4f8346490903f212a912
          path: .jarvis-source
          persist-credentials: false
      - name: Observe actual Worker and Makima field names only
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/makima-provider-inspect.mjs
