name: Deploy to Azure Storage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "assets/**"
      - "scripts/build.mjs"
      - "package.json"
      - ".github/workflows/deploy-azure-storage.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source
        run: npm test
      - name: Build deployment artifact
        run: npm run build
      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Upload site to the static website container
        run: |
          az storage blob upload-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login \
            --destination '$web' \
            --source dist \
            --overwrite true
      - name: Sign out of Azure
        if: always()
        run: az logout
