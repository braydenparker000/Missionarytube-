name: Deploy to Azure Storage

on:
  workflow_dispatch:
    inputs:
      publish_mobile_file_save:
        description: Publish only qualified Relay and Guitar saving modules; retain every setting and unrelated blob
        type: boolean
        default: false
      publish_media_only:
        description: Publish only the two reviewed media appearance files and chain the component release receipt
        type: boolean
        default: false
      publish_active_public_provenance:
        description: Publish only the destination-owned active-public source receipt; preserve every runtime blob
        type: boolean
        default: false
      publish_simple_chat_tasks:
        description: Publish the qualified Relay and Muse Chat and Tasks UI while retaining every setting and unrelated blob
        type: boolean
        default: false
      publish_owner_progress:
        description: Publish private owner text updates and Poweramp sort information
        type: boolean
        default: false
      publish_muse_relay_design:
        description: Publish Muse using the existing Relay design
        type: boolean
        default: false
      publish_poweramp_playlists:
        description: Publish the qualified curated playlists and durable importer
        type: boolean
        default: false
      publish_muse_launcher:
        description: Publish the qualified Muse conversation switch; preserve all other files
        type: boolean
        default: false
      publish_poweramp_background:
        description: Publish qualified persistent shuffle, preserving Worker settings
        type: boolean
        default: false
      deploy_mast_chat_only:
        description: Recover the exact deployed Mast reply receipt without uploading Worker code
        type: boolean
        default: false
      activate_owner_mast:
        description: Activate only the approved private owner-Mast chat fingerprint and flag
        type: boolean
        default: false
      deploy_private_wake:
        description: Deploy the exact qualified private Muse wake Worker without changing settings or frontend
        type: boolean
        default: false
      replace_muse_fingerprint:
        description: 'Replace only the owner-approved Muse fingerprint using exact old/new pins'
        type: boolean
        default: false
      recover_lucy_muse_receipt:
        description: 'Read-only settings verification and receipt recovery; no settings write'
        type: boolean
        default: false
      diagnose_lucy_muse:
        description: 'Read-only diagnosis of the retained activation checkpoint'
        type: boolean
        default: false
      activate_lucy_muse:
        description: 'Apply the approved pinned private-channel settings only'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "jarvis-release.json"
      - "scripts/*jarvis*.mjs"
      - "scripts/r2-player-config.mjs"
      - "tests/**"
      - "*.html"
      - "assets/**"
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-azure-storage.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  qualification:
    if: ${{ inputs.publish_owner_progress != true && inputs.publish_muse_relay_design != true && inputs.publish_poweramp_playlists != true && inputs.publish_muse_launcher != true && inputs.publish_poweramp_background != true && inputs.deploy_mast_chat_only != true && inputs.activate_owner_mast != true && inputs.deploy_private_wake != true && inputs.activate_lucy_muse != true && inputs.diagnose_lucy_muse != true && inputs.recover_lucy_muse_receipt != true && inputs.replace_muse_fingerprint != true && inputs.publish_simple_chat_tasks != true && inputs.publish_mobile_file_save != true }}
    uses: ./.github/workflows/qualify-jarvis.yml
    permissions:
      contents: read
  deploy:
    needs: qualification
    if: ${{ inputs.publish_owner_progress != true && inputs.publish_muse_relay_design != true && inputs.publish_poweramp_playlists != true && inputs.publish_muse_launcher != true && inputs.publish_poweramp_background != true && inputs.publish_active_public_provenance != true && inputs.publish_media_only != true && vars.AZURE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_mast_chat_only != true && inputs.activate_owner_mast != true && inputs.deploy_private_wake != true && inputs.activate_lucy_muse != true && inputs.publish_simple_chat_tasks != true && inputs.publish_mobile_file_save != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - name: Check out exact orchestration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.qualification.outputs.node22 }}
      - name: Read pinned Jarvis revision
        id: jarvis
        run: |
          node -p "'commit=' + require('./jarvis-release.json').commit" >> "$GITHUB_OUTPUT"
          node -p "'preserve_catalog=' + (require('./jarvis-release.json').preserveDriveCatalog === true)" >> "$GITHUB_OUTPUT"
          node -p "'podcasts_enabled=' + (require('./jarvis-release.json').deployPodcastWorker === true)" >> "$GITHUB_OUTPUT"
          node -p "'receipt_only=' + (require('./jarvis-release.json').workerDeploymentPolicy.mode === 'reconcile-lucy-discovery')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: braydenparker000/Missionarytube-
          ref: ${{ steps.jarvis.outputs.commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Download this run's exact qualified frontend
        uses: actions/download-artifact@v4
        with:
          name: jarvis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify immutable artifact before provider credentials or changes
        run: node scripts/qualified-artifact.mjs verify
      - name: Install locked dependencies for final live browser verification
        run: npm --prefix .jarvis-source ci
      - name: Preserve current bindings and prepare the exact qualified Worker
        if: steps.jarvis.outputs.podcasts_enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          node scripts/check-music-worker-bindings.mjs
          node scripts/prepare-music-worker.mjs .jarvis-source
      - name: Verify retained reconciliation provenance
        if: steps.jarvis.outputs.receipt_only == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-lucy-receipt.mjs provenance
      - name: Record existing Worker and preserved frontend receipt
        id: reconciliation
        if: steps.jarvis.outputs.receipt_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/reconcile-lucy-receipt.mjs record
      - name: Verify actual live Worker identity and compatible unchanged configuration
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true') }}
        id: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/relay-worker-release-identity.mjs plan
      - name: Prepare isolated Worker tooling without changing qualified dependencies
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true' && steps.worker.outputs.deploy == 'true') }}
        run: node scripts/prepare-worker-tools.mjs prepare
      - name: Deploy the exact qualified changed Worker with rollback checkpoint
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true' && steps.worker.outputs.deploy == 'true') }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: .worker-tools
          preCommands: npx wrangler versions list --name jarvis-hub-api --json > "$GITHUB_WORKSPACE/.jarvis-source/worker-versions-before.json"
          command: deploy --config "${{ github.workspace }}/.jarvis-source/backend/wrangler.music.generated.json"
          postCommands: npx wrangler versions list --name jarvis-hub-api --json > "$GITHUB_WORKSPACE/.jarvis-source/worker-versions-after.json"
      - name: Verify installer left qualified source dependencies unchanged
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true' && steps.worker.outputs.deploy == 'true') }}
        run: node scripts/prepare-worker-tools.mjs verify
      - name: Prepare public Quick AI keys
        if: steps.jarvis.outputs.receipt_only != 'true'
        env:
          QUICK_AI_GEMINI_KEY: ${{ secrets.QUICK_AI_GEMINI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QUICK_AI_TAVILY_KEY: ${{ secrets.QUICK_AI_TAVILY_KEY }}
        run: node .jarvis-source/scripts/configure-quick-ai.mjs dist
      - name: Configure shared Drive
        if: steps.jarvis.outputs.receipt_only != 'true'
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: node .jarvis-source/scripts/configure-drive.mjs dist
      - name: Seal the final configured artifact without exposing configuration values
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/qualified-artifact.mjs configure
      - name: Require existing backend before changing live blobs
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/check-jarvis-api.mjs
      - name: Sign in to Azure with OIDC
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the existing deployment target
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: test "$STORAGE_ACCOUNT" = missionarytube
      - name: Join real podcast readiness and verified full rollback backup
        if: steps.jarvis.outputs.receipt_only != 'true'
        env:
          PODCASTS_ENABLED: ${{ steps.jarvis.outputs.podcasts_enabled }}
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          AZCOPY_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: node scripts/overlap-jarvis-prewrite.mjs
      - name: Record the actual qualified active Worker and configuration
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/relay-worker-release-identity.mjs record
      - name: Preserve podcast Worker rollback and exact identity information
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (always() && steps.jarvis.outputs.podcasts_enabled == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-worker-${{ github.run_id }}
          path: |
            .jarvis-source/worker-versions-before.json
            .jarvis-source/worker-versions-after.json
            .jarvis-source/backend/wrangler.music.generated.json
            worker-bindings-before.json
            worker-identity-before.json
            worker-identity-current.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save rollback artifact before any overwrite
        if: steps.jarvis.outputs.receipt_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storage-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback/
          if-no-files-found: error
          retention-days: 90
      - name: Install media preparation tool from Ubuntu packages
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.preserve_catalog != 'true') }}
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version > /dev/null
      - name: Publish a verified catalog before installing the v2 reader
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.preserve_catalog != 'true') }}
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: node .jarvis-source/scripts/publish-drive-catalog.mjs
      - name: Verify sealed configured bytes immediately before staging
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/qualified-artifact.mjs verify-configured
      - name: Upload and verify all Relay dependencies before importer overwrite
        if: steps.jarvis.outputs.receipt_only != 'true'
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: node scripts/stage-relay-core-dependencies.mjs
      - name: Stage Jarvis while keeping the current homepage
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: |
          cp -a dist upload
          rm upload/index.html
          rm upload/assets/relay-transfer.js upload/assets/relay-draft-store.js upload/assets/public-coordination.js upload/assets/public-reader-cache.js upload/assets/relay-menu-history.js upload/assets/relay-attachment-contract.js upload/assets/relay-attachment-content.js upload/assets/relay-attachments.js
          az storage blob upload-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login --destination '$web' --source upload \
            --overwrite true --content-cache-control no-cache --only-show-errors
      - name: Check every staged file and directory route
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/check-jarvis-static.mjs
      - name: Require working backend for the Storage origin
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/check-jarvis-api.mjs
      - name: Revalidate sealed configured bytes before homepage promotion
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/qualified-artifact.mjs verify-configured
      - name: Revalidate actual backend identity immediately before homepage promotion
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/relay-worker-release-identity.mjs verify
      - name: Promote Jarvis homepage after successful checks
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: |
          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login --container-name '$web' \
            --name index.html --file dist/index.html \
            --content-type 'text/html; charset=utf-8' \
            --content-cache-control no-cache --overwrite true --only-show-errors
      - name: Verify the final root and all frontend files
        if: steps.jarvis.outputs.receipt_only != 'true'
        run: node scripts/check-jarvis-static.mjs --cutover
      - name: Verify real podcast discovery and playback in the deployed mobile page
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true') }}
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          export PODCAST_LIVE_URL="https://missionarytube.z13.web.core.windows.net/podcasts/"
          export JARVIS_SCREENSHOT_DIR="$RUNNER_TEMP/podcasts-live"
          cd .jarvis-source
          node --test --test-name-pattern='live podcast discovery' tests/podcasts-browser.test.js
      - name: Preserve live podcast mobile screenshots
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (always() && steps.jarvis.outputs.podcasts_enabled == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: podcasts-live-${{ github.run_id }}
          path: ${{ runner.temp }}/podcasts-live
          if-no-files-found: ignore
          retention-days: 14
      - name: Record a digest-bound production receipt after all live checks
        id: receipt
        if: ${{ steps.jarvis.outputs.receipt_only != 'true' && (steps.jarvis.outputs.podcasts_enabled == 'true') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/relay-worker-release-identity.mjs receipt
      - name: verified-production-receipt-${{ steps.reconciliation.outputs.digest || steps.receipt.outputs.digest }}
        if: steps.jarvis.outputs.podcasts_enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_RECEIPT_DIGEST: ${{ steps.reconciliation.outputs.digest || steps.receipt.outputs.digest }}
        run: |
          if [ "${{ steps.jarvis.outputs.receipt_only }}" = true ]; then
            node scripts/reconcile-lucy-receipt.mjs verify
          else
            node scripts/relay-worker-release-identity.mjs verify-receipt
          fi
      - name: Publish the verified production receipt
        if: steps.jarvis.outputs.podcasts_enabled == 'true'
        run: |
          az storage blob upload --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" --auth-mode login --container-name '$web' \
            --name release-qualified.json --file release-qualified.json --content-type 'application/json' \
            --content-cache-control no-cache --overwrite true --only-show-errors
      - name: Verify published reconciliation receipt
        if: steps.jarvis.outputs.receipt_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_RECEIPT_DIGEST: ${{ steps.reconciliation.outputs.digest }}
        run: node scripts/reconcile-lucy-receipt.mjs verify-published
      - name: Preserve prior and reconciled receipts
        if: ${{ always() && steps.reconciliation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: receipt-reconciliation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lucy-reconcile/previous-receipt.json
            release-qualified.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Sign out of Azure
        if: ${{ always() && steps.azure_signin.outcome == 'success' }}
        run: az logout

  activate-lucy-muse:
    name: deploy
    if: ${{ inputs.publish_owner_progress != true && inputs.publish_muse_relay_design != true && inputs.publish_poweramp_playlists != true && inputs.publish_muse_launcher != true && inputs.publish_poweramp_background != true && github.event_name == 'workflow_dispatch' && inputs.deploy_mast_chat_only != true && inputs.activate_owner_mast != true && inputs.deploy_private_wake != true && (inputs.activate_lucy_muse == true || inputs.diagnose_lucy_muse == true || inputs.recover_lucy_muse_receipt == true || inputs.replace_muse_fingerprint == true) && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && inputs.publish_simple_chat_tasks != true && inputs.publish_mobile_file_save != true && inputs.publish_media_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Apply and verify the exact approved settings transition
        id: activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/activate-lucy-muse.mjs ${{ inputs.diagnose_lucy_muse == true && 'diagnose' || inputs.recover_lucy_muse_receipt == true && 'recover' || inputs.replace_muse_fingerprint == true && 'replace' || 'activate' }}
      - name: Sign in using existing Azure identity
        if: inputs.diagnose_lucy_muse != true
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: verified-production-receipt-${{ steps.activation.outputs.digest }}
        if: inputs.diagnose_lucy_muse != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_RECEIPT_DIGEST: ${{ steps.activation.outputs.digest }}
        run: node scripts/activate-lucy-muse.mjs stamp
      - name: Publish only the verified settings receipt
        if: inputs.diagnose_lucy_muse != true
        run: |
          az storage blob upload --account-name missionarytube --auth-mode login --container-name '$web' \
            --name release-qualified.json --file release-qualified.json --content-type 'application/json' \
            --content-cache-control no-cache --overwrite true --only-show-errors
      - name: Verify published receipt and authenticated channel boundary
        if: inputs.diagnose_lucy_muse != true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_RECEIPT_DIGEST: ${{ steps.activation.outputs.digest }}
        run: node scripts/activate-lucy-muse.mjs published
      - name: Preserve nonsecret activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-activation-${{ github.run_id }}
          path: |
            channel-activation/
            release-qualified.json
          retention-days: 90
          if-no-files-found: warn
      - name: Sign out
        if: ${{ always() && steps.azure_signin.outcome == 'success' }}
        run: az logout

  private-wake:
    name: deploy
    if: ${{ inputs.publish_owner_progress != true && inputs.publish_muse_relay_design != true && inputs.publish_poweramp_playlists != true && inputs.publish_muse_launcher != true && inputs.publish_poweramp_background != true && github.event_name == 'workflow_dispatch' && inputs.deploy_mast_chat_only != true && inputs.activate_owner_mast != true && inputs.deploy_private_wake == true && inputs.activate_lucy_muse != true && inputs.diagnose_lucy_muse != true && inputs.recover_lucy_muse_receipt != true && inputs.replace_muse_fingerprint != true && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && inputs.publish_simple_chat_tasks != true && inputs.publish_mobile_file_save != true && inputs.publish_media_only != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/checkout@v4
        with:
          repository: braydenparker000/Missionarytube-
          ref: 126d4bc4c792a188b2e86cd334bd4bcd6ab3a74c
          path: .jarvis-source
          persist-credentials: false
      - name: Verify exact source proof and retained production receipt
        run: node scripts/deploy-private-wake.mjs prepare
      - name: Install exact source dependencies
        run: npm --prefix .jarvis-source ci
      - name: Prepare isolated pinned Worker tooling
        run: |
          node scripts/prepare-worker-tools.mjs prepare
          npm --prefix .worker-tools install --no-save wrangler@4.136.3
      - name: Build the qualified Worker without publishing
        working-directory: .worker-tools
        run: npx wrangler deploy --dry-run --config "$GITHUB_WORKSPACE/.jarvis-source/backend/wrangler.music.generated.json" --outdir "$GITHUB_WORKSPACE/private-wake-release/bundle"
      - name: Checkpoint exact Worker and every retained binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/deploy-private-wake.mjs checkpoint
      - name: Deploy only the qualified Worker
        working-directory: .worker-tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          npx wrangler versions list --name jarvis-hub-api --json > "$GITHUB_WORKSPACE/private-wake-release/versions-before.json"
          npx wrangler deploy --config "$GITHUB_WORKSPACE/.jarvis-source/backend/wrangler.music.generated.json"
          npx wrangler versions list --name jarvis-hub-api --json > "$GITHUB_WORKSPACE/private-wake-release/versions-after.json"
      - name: Verify source dependency isolation
        run: node scripts/prepare-worker-tools.mjs verify
      - name: Verify uploaded bytes and unchanged bindings; record receipt
        id: wake
        env:
