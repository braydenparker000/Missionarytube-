name: Deploy to Azure Storage
run-name: Frontend ${{ inputs.action }} at ${{ inputs.expected_commit }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [publish, rollback]
        required: true
      expected_commit:
        description: Full reviewed main SHA; stop if main moved before dispatch
        type: string
        required: true
      rollback_run_id:
        description: For rollback only, the original frontend publication run
        type: string
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  qualification:
    if: ${{ inputs.action == 'publish' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/qualify-jarvis.yml
    permissions:
      contents: read
  deploy:
    needs: qualification
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' && ((inputs.action == 'publish' && needs.qualification.result == 'success') || (inputs.action == 'rollback' && inputs.rollback_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FRONTEND_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      FRONTEND_ROLLBACK_RUN_ID: ${{ inputs.action == 'rollback' && inputs.rollback_run_id || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify reviewed revision and trusted publication history
        id: parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-frontend.mjs parent
      - name: Retrieve trusted parent evidence
        if: ${{ inputs.action == 'publish' && steps.parent.outputs.run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-evidence-${{ steps.parent.outputs.run_id }}
          run-id: ${{ steps.parent.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .runtime-parent/evidence/
      - name: Read historical qualification identity
        if: ${{ inputs.action == 'publish' }}
        id: source
        run: node -p "'commit=' + require('./jarvis-release.json').commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ inputs.action == 'publish' }}
        with:
          repository: braydenparker000/Missionarytube-
          ref: ${{ steps.source.outputs.commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Download this run's exact qualified frontend
        if: ${{ inputs.action == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: jarvis-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify immutable artifact before provider credentials or changes
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/qualified-artifact.mjs verify
      - name: Install locked browser tooling and check built Board
        if: ${{ inputs.action == 'publish' }}
        run: |
          npm ci
          node scripts/install-jarvis-browser.mjs
          DAILY_BOARD_ARTIFACT_ROOT=dist node --test tests/daily-board-browser.test.mjs
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture complete baseline and rollback without writing production
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-frontend.mjs prepare
      - name: Save rollback artifact before any overwrite
        if: ${{ inputs.action == 'publish' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-rollback-${{ github.run_id }}
          path: .runtime-release/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Publish dependencies, documents and release metadata with conditional writes and public readback
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-frontend.mjs publish
      - name: Verify the delivered Board in Chrome using isolated synthetic reads and real public reads
        if: ${{ inputs.action == 'publish' }}
        env:
          DAILY_BOARD_ORIGIN: https://missionarytube.z13.web.core.windows.net
        run: node --test tests/daily-board-browser.test.mjs
      - name: Verify delivered private image previews with synthetic owner requests only
        if: ${{ inputs.action == 'publish' }}
        env:
          REQUIRE_RELAY_OWNER_BROWSER: '1'
          JARVIS_LIVE_ASSETS: '1'
        working-directory: backend
        run: node --test tests/relay-mast-files-browser.test.js
      - name: Retrieve rollback saved before publication
        if: ${{ inputs.action == 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-rollback-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
          path: .runtime-release/
      - name: Restore captured application bytes and properties; retain additive assets and all content
        if: ${{ inputs.action == 'rollback' }}
        run: node scripts/publish-frontend.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: .runtime-release/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: ignore
      - name: Sign out
        if: always()
        run: az logout
