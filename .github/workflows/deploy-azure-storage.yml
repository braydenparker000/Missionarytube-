name: Deploy to Azure Storage

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "jarvis-release.json"
      - "scripts/*jarvis*.mjs"
      - "scripts/r2-player-config.mjs"
      - "tests/**"
      - "*.html"
      - "assets/**"
      - "src/**"
      - "scripts/build.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-azure-storage.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  podcast_worker:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the exact podcast release
        id: release
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('jarvis-release.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(r.commit))throw Error('An immutable source commit is required');
          console.log('commit='+r.commit);
          console.log('enabled='+(r.deployPodcastWorker===true));
          JS
      - uses: actions/checkout@v4
        if: steps.release.outputs.enabled == 'true'
        with:
          repository: braydenparker999/jarvis
          ref: ${{ steps.release.outputs.commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Test the pinned podcast source before deployment
        if: steps.release.outputs.enabled == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          test "$(git -C .jarvis-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -f .jarvis-source/backend/podcasts.js
          npm --prefix .jarvis-source ci
          npm --prefix .jarvis-source test
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          cd .jarvis-source
          node --test tests/podcasts-browser.test.js
      - name: Preserve existing bindings and prepare the podcast Worker
        if: steps.release.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          node scripts/check-music-worker-bindings.mjs
          node scripts/prepare-music-worker.mjs .jarvis-source
      - name: Deploy the existing Worker with podcast routes
        if: steps.release.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: .jarvis-source
          preCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-before.json
          command: deploy --config backend/wrangler.music.generated.json
          postCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-after.json
      - name: Require real directory search, RSS and audio before frontend promotion
        if: steps.release.outputs.enabled == 'true'
        run: node .jarvis-source/scripts/verify-podcasts.mjs
      - name: Preserve podcast Worker rollback information
        if: ${{ always() && steps.release.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: podcast-worker-${{ github.run_id }}
          path: |
            .jarvis-source/worker-versions-before.json
            .jarvis-source/worker-versions-after.json
            .jarvis-source/backend/wrangler.music.generated.json
            worker-bindings-before.json
          if-no-files-found: warn
          retention-days: 30
  deploy:
    needs: podcast_worker
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Read pinned Jarvis revision
        id: jarvis
        run: |
          node -p "'commit=' + require('./jarvis-release.json').commit" >> "$GITHUB_OUTPUT"
          node -p "'preserve_catalog=' + (require('./jarvis-release.json').preserveDriveCatalog === true)" >> "$GITHUB_OUTPUT"
          node -p "'podcasts_enabled=' + (require('./jarvis-release.json').deployPodcastWorker === true)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Jarvis source
        uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: ${{ steps.jarvis.outputs.commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate source
        run: npm test
      - name: Validate Jarvis
        run: npm run test:jarvis
      - name: Build deployment artifact
        run: npm run build
      - name: Prepare public Quick AI keys
        env:
          QUICK_AI_GEMINI_KEY: ${{ secrets.QUICK_AI_GEMINI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          QUICK_AI_TAVILY_KEY: ${{ secrets.QUICK_AI_TAVILY_KEY }}
        run: node .jarvis-source/scripts/configure-quick-ai.mjs dist
      - name: Configure shared Drive
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
        run: node .jarvis-source/scripts/configure-drive.mjs dist
      - name: Require existing backend before changing live blobs
        run: node scripts/check-jarvis-api.mjs
      - name: Sign in to Azure with OIDC
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify the existing deployment target
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: test "$STORAGE_ACCOUNT" = missionarytube
      - name: Preserve existing website bytes and properties
        env:
          STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: |
          mkdir -p rollback/files
          az storage blob list --account-name "$STORAGE_ACCOUNT" --auth-mode login --container-name '$web' --output json > rollback/manifest.json
          az storage blob download-batch --account-name "$STORAGE_ACCOUNT" --auth-mode login --source '$web' --destination rollback/files --no-progress --only-show-errors
          test -s rollback/files/index.html
          cp jarvis-release.json rollback/new-release.json
      - name: Save rollback artifact before any overwrite
        uses: actions/upload-artifact@v4
        with:
          name: storage-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback/
          if-no-files-found: error
          retention-days: 90
      - name: Install media preparation tool from Ubuntu packages
        if: ${{ steps.jarvis.outputs.preserve_catalog != 'true' }}
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version > /dev/null
      - name: Publish a verified catalog before installing the v2 reader
        if: ${{ steps.jarvis.outputs.preserve_catalog != 'true' }}
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
        run: node .jarvis-source/scripts/publish-drive-catalog.mjs
      - name: Stage Jarvis while keeping the current homepage
        run: |
          cp -a dist upload
          rm upload/index.html
          az storage blob upload-batch \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login --destination '$web' --source upload \
            --overwrite true --content-cache-control no-cache --only-show-errors
      - name: Check every staged file and directory route
        run: node scripts/check-jarvis-static.mjs
      - name: Require working backend for the Storage origin
        run: node scripts/check-jarvis-api.mjs
      - name: Promote Jarvis homepage after successful checks
        run: |
          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --auth-mode login --container-name '$web' \
            --name index.html --file dist/index.html \
            --content-type 'text/html; charset=utf-8' \
            --content-cache-control no-cache --overwrite true --only-show-errors
      - name: Verify the final root and all frontend files
        run: node scripts/check-jarvis-static.mjs --cutover
      - name: Verify real podcast discovery and playback in the deployed mobile page
        if: steps.jarvis.outputs.podcasts_enabled == 'true'
        run: |
          export JARVIS_CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$JARVIS_CHROME"
          export PODCAST_LIVE_URL="https://missionarytube.z13.web.core.windows.net/podcasts/"
          export JARVIS_SCREENSHOT_DIR="$RUNNER_TEMP/podcasts-live"
          cd .jarvis-source
          node --test --test-name-pattern='live podcast discovery' tests/podcasts-browser.test.js
      - name: Preserve live podcast mobile screenshots
        if: ${{ always() && steps.jarvis.outputs.podcasts_enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: podcasts-live-${{ github.run_id }}
          path: ${{ runner.temp }}/podcasts-live
          if-no-files-found: ignore
          retention-days: 14
      - name: Sign out of Azure
        if: ${{ always() && steps.azure_signin.outcome == 'success' }}
        run: az logout
