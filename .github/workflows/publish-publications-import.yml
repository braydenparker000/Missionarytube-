name: Restore historical Daily Board importer
on:
  workflow_dispatch:
    inputs:
      rollback_candidate:
        description: Restore exact prepublication Worker and cache bytes from a prior run artifact
        type: boolean
        default: false
      rollback_run_id:
        description: Required prior publication workflow run ID when rollback_candidate is true
        type: string
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  rollback:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' && inputs.rollback_candidate == true && inputs.rollback_run_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: publications-import-rollback-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          path: publications-import-publication
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign in using the existing Azure deployment identity
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Restore only when both candidate hashes are still live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/publications-import-release.mjs rollback
      - name: Sign out
        if: always() && steps.azure_signin.outcome == 'success'
        run: az logout
