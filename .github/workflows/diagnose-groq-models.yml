name: Compare Groq models (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test model and request profile with the configured Quick Chat key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.GROQ_API_KEY;
          if(!key)throw Error('Groq secret missing');
          const cases=[
            {name:'qwen-minimal',model:'qwen/qwen3.8-27b',max_completion_tokens:64},
            {name:'gpt-oss-minimal',model:'openai/gpt-oss-20b',max_completion_tokens:64},
            {name:'qwen-quick-chat',model:'qwen/qwen3.8-27b',max_completion_tokens:2048,reasoning_effort:'medium',reasoning_format:'hidden',stream:true,stream_options:{include_usage:true}}
          ];
          for(const item of cases){
            const {name,...fields}=item;
            const response=await fetch('https://api.groq.com/openai/v1/chat/completions',{
              method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${key}`},
              body:JSON.stringify({...fields,messages:[{role:'user',content:'Reply with OK.'}]})
            });
            const body=await response.text();
            let error;
            try{error=JSON.parse(body).error;}catch{}
            const message=typeof error?.message==='string'?error.message:'';
            const limit=message.match(/\bLimit\s*([\d,]+)\s*,\s*Used\s*([\d,]+)\s*,\s*Requested\s*([\d,]+)/i);
            const allowedCodes=new Set(['rate_limit_exceeded','model_permission_blocked_org','model_permission_blocked_project','insufficient_quota','quota_exceeded']);
            const remaining=name=>{const raw=response.headers.get('x-ratelimit-remaining-'+name);return raw!==null&&/^\d+$/.test(raw)?Number(raw):null;};
            const retry=response.headers.get('retry-after');
            console.log(JSON.stringify({case:name,status:response.status,
              code:allowedCodes.has(error?.code)?error.code:null,
              limit:limit?{limit:Number(limit[1].replaceAll(',','')),used:Number(limit[2].replaceAll(',','')),requested:Number(limit[3].replaceAll(',',''))}:null,
              remainingDailyRequests:remaining('requests'),remainingMinuteTokens:remaining('tokens'),
              retrySeconds:retry&&/^\d+$/.test(retry)?Number(retry):null,
              hints:{tokensPerMinute:/tokens per minute|TPM/i.test(message),requestsPerDay:/requests per day|RPD/i.test(message),spend:/spend limit|billing/i.test(message)}
            }));
          }
          NODE
