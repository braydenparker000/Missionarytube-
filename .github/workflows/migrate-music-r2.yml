name: Clone Drive music to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-music-r2.yml'
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full reviewed main SHA; current scripts are the only migration source
        required: true
        type: string
      limit:
        description: 'Tracks to verify/copy (5 = smoke test, 0 = full library)'
        required: true
        default: '5'
        type: string
      concurrency:
        description: 'Parallel file transfers (1-8)'
        required: true
        default: '1'
        type: string
      auth_mode:
        description: 'Owner OAuth grant or the existing public-file API key'
        required: true
        default: oauth
        type: choice
        options: [oauth, public_api_key]
      mode:
        description: 'Probe reads one Drive file without writing R2; incremental requires a completed clone'
        required: true
        default: probe
        type: choice
        options: [probe, copy, incremental]

permissions:
  contents: read

concurrency:
  group: r2-music-migration
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out current migration tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact tested source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test migration integrity and refusal guards
        run: |
          python -m py_compile scripts/migrate-drive-to-r2.py
          python -m unittest discover -s tests/python -p 'test_r2*.py' -v

  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - name: Require the reviewed main revision before provider access
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install R2 client dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'boto3>=1.35,<2'

      - name: Read or copy with the selected owner authorization
        env:
          GOOGLE_DRIVE_AUTH_MODE: ${{ inputs.auth_mode }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
          DRIVE_DOWNLOAD_INTERVAL_SECONDS: '5'
          MIGRATION_MODE: ${{ inputs.mode }}
          MIGRATION_LIMIT: ${{ inputs.limit }}
          MIGRATION_CONCURRENCY: ${{ inputs.concurrency }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MIGRATION_MODE" = probe ]; then
            python - <<'PYTHON'
          import importlib.util, json, os, tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.')
          spec = importlib.util.spec_from_file_location('migration', root / 'scripts/migrate-drive-to-r2.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          try:
              auth = m.drive_auth_from_env()
              config = json.loads((root / 'frontend/assets/drive-config.json').read_text())
              _, files = m.list_music(config['folderId'], auth)
              if not files:
                  raise m.MigrationError('Drive music inventory is empty.')
              with tempfile.TemporaryDirectory() as directory:
                  hashes = m.download_drive_file(files[0], auth, Path(directory) / 'probe')
              report = {'checkedAt': datetime.now(timezone.utc).isoformat(), 'mode': 'drive-only-probe', 'authMode': os.environ['GOOGLE_DRIVE_AUTH_MODE'], 'complete': False, 'driveId': files[0]['id'], 'hashes': hashes, 'r2Written': False}
              (root / 'drive-probe-report.json').write_text(json.dumps(report, indent=2) + '\n')
              print('One Drive audio file downloaded and hashed. No R2 objects or Drive originals were changed.')
          except Exception as exc:
              raise SystemExit(m.safe_error(exc)) from None
          PYTHON
          elif [ "$MIGRATION_MODE" = copy ]; then
            python scripts/migrate-drive-to-r2.py --limit "$MIGRATION_LIMIT" --concurrency "$MIGRATION_CONCURRENCY"
          elif [ "$MIGRATION_MODE" = incremental ]; then
            test "$MIGRATION_LIMIT" = 0 || { echo 'Incremental mode requires limit=0.'; exit 1; }
            python scripts/migrate-drive-to-r2.py --limit 0 --concurrency "$MIGRATION_CONCURRENCY" --incremental
          else
            echo 'Invalid migration mode.'; exit 1
          fi

      - name: Save migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            r2-migration-report.json
            drive-probe-report.json
          if-no-files-found: ignore
          retention-days: 30
