name: Manual R2 audio analysis
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed Jarvis source SHA
        required: true
        type: string
      mode:
        description: Analyze writes artifacts only; apply updates analysis metadata only
        type: choice
        options: [analyze, apply]
        default: analyze
      limit:
        description: Bounded batch size 1..100
        type: string
        default: '50'
      after_id:
        description: Resume strictly after this reviewed checkpoint ID
        type: string
        default: ''
      analysis_run_id:
        description: For apply, completed successful analysis run artifact from this workflow
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: jarvis-audio-analysis
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact reviewed source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: ${{ inputs.source_commit }}
          path: .jarvis-source
          persist-credentials: false
      - name: Verify schema and upload security tests without credentials
        working-directory: .jarvis-source
        run: node --test tests/audio-fidelity.test.js tests/native-r2.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional preparation tools
        run: |
          python -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Validate reviewed analysis artifact
        if: ${{ inputs.mode == 'apply' }}
        id: artifact
        uses: actions/github-script@v7
        env:
          ANALYSIS_RUN_ID: ${{ inputs.analysis_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        with:
          script: |
            const id=process.env.ANALYSIS_RUN_ID;
            if(!/^[1-9][0-9]{0,14}$/.test(id))throw Error('Completed analysis run ID required');
            const {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:Number(id)});
            if(run.status!=='completed'||run.conclusion!=='success'||run.path!=='.github/workflows/analyze-r2-audio.yml')throw Error('Unexpected analysis run');
            const {data}=await github.rest.actions.listWorkflowRunArtifacts({...context.repo,run_id:Number(id)});
            const name=`audio-analysis-${id}`;
            if(data.artifacts.filter(a=>a.name===name&&!a.expired).length!==1)throw Error('One retained analysis artifact required');
            core.setOutput('name',name);
      - uses: actions/download-artifact@v4
        if: ${{ inputs.mode == 'apply' }}
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.analysis_run_id }}
          name: ${{ steps.artifact.outputs.name }}
          path: .jarvis-source/reviewed-analysis
      - name: Analyze existing R2 bytes or apply reviewed metadata conditionally
        working-directory: .jarvis-source
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ANALYSIS_MODE: ${{ inputs.mode }}
          ANALYSIS_LIMIT: ${{ inputs.limit }}
          ANALYSIS_AFTER_ID: ${{ inputs.after_id }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p audio-analysis
          python scripts/audio/backfill.py "$ANALYSIS_MODE" --limit "$ANALYSIS_LIMIT" --after-id "$ANALYSIS_AFTER_ID" --input reviewed-analysis/report.json --report audio-analysis/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-analysis-${{ github.run_id }}
          path: .jarvis-source/audio-analysis
          if-no-files-found: error
          retention-days: 30
