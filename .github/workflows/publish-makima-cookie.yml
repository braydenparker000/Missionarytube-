name: Publish Makima session repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-makima-cookie.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'publish-makima-dcb111b7-once'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: dcb111b7bc15642cabddbb8a8651fd4f918fe608
          path: .makima-cookie-source
          persist-credentials: false
          fetch-depth: 0
      - run: npm ci --ignore-scripts
        working-directory: .makima-cookie-source
      - name: Verify exact trusted qualification and reproduce deployed Makima baseline
        run: node scripts/publish-makima-cookie.mjs prepare
      - name: Publish only Makima repair code and preserve all settings and schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/publish-makima-cookie.mjs deploy
      - name: Verify exact live code and unchanged settings and schedules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/publish-makima-cookie.mjs verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makima-cookie-evidence-${{ github.run_id }}
          path: makima-cookie-publication/*.json
          retention-days: 90
          if-no-files-found: error



