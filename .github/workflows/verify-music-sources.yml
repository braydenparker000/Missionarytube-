name: Verify live music sources

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy to Azure Storage]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: music-source-browser-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Read the exact publication receipt, including restored bytes after rollback
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: frontend-evidence-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: music-verification/publication/
      - name: Verify delivered R2 bytes, decoding, Range and CORS
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          node scripts/verify-music-worker.mjs
      - name: Use the runner's installed Chrome
        run: |
          chrome_path=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$chrome_path"
          printf 'MUSIC_BROWSER_EXECUTABLE=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Verify independent live playback, seeking and artwork
        env:
          MUSIC_PUBLICATION_RECEIPT: ${{ github.event_name == 'workflow_run' && 'music-verification/publication/receipt.json' || '' }}
        run: node scripts/verify-music-sources.mjs
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-sources-${{ github.run_id }}
          path: |
            music-verification/browser/
            music-verification/report.json
          if-no-files-found: error
          retention-days: 30
