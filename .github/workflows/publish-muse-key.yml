name: Publish reviewed Muse key helper
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: 833b97c4264c364dcce0789a6d64f938176a9057
          path: .muse-source
          persist-credentials: false
      - name: Verify exact trusted-source proof and existing production receipt
        run: node scripts/publish-muse-key.mjs prepare
      - name: Sign in using existing Azure identity
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish only absent reviewed helper files
        run: node scripts/publish-muse-key.mjs publish
      - name: Verify live route and unchanged receipt
        run: node scripts/publish-muse-key.mjs verify
      - name: Preserve publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-key-publication-${{ github.run_id }}
          path: muse-key-publication/
          if-no-files-found: error
          retention-days: 30
      - name: Sign out
        if: ${{ always() && steps.azure_signin.outcome == 'success' }}
        run: az logout
