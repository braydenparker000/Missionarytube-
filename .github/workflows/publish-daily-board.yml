name: Restore historical Daily Board
run-name: Daily Board rollback at ${{ inputs.expected_commit }}
on:
  workflow_dispatch:
    inputs:
      rollback_run_id:
        description: Original Daily Board publication run to restore
        type: string
        required: true
      expected_commit:
        description: Full reviewed main SHA; stop if main moved before dispatch
        type: string
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  rollback:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DAILY_BOARD_PARENT_RUN_ID: ${{ inputs.rollback_run_id }}
      DAILY_BOARD_ROLLBACK: 'true'
      DAILY_BOARD_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify the selected historical publication belongs to this trusted main workflow
        id: parent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-daily-board.mjs parent
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Retrieve the original rollback artifact
        uses: actions/download-artifact@v4
        with:
          name: daily-board-rollback-${{ steps.parent.outputs.run_id }}
          run-id: ${{ steps.parent.outputs.run_id }}
          github-token: ${{ github.token }}
          path: daily-board-publication/
      - name: Restore captured Board bytes and properties without deleting content
        run: node scripts/publish-daily-board.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-board-evidence-${{ github.run_id }}
          path: daily-board-publication/
          retention-days: 90
      - name: Sign out
        if: always()
        run: az logout
