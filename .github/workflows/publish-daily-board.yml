name: Publish composable Daily Board
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [publish, rollback]
        required: true
      rollback_run_id:
        type: string
        required: false
      parent_run_id:
        description: Successful Daily Board publication whose receipt matches the current live files
        type: string
        required: false
      expected_commit:
        description: Full reviewed main SHA; stop if main moved before dispatch
        type: string
        required: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DAILY_BOARD_PARENT_RUN_ID: ${{ inputs.action == 'rollback' && inputs.rollback_run_id || inputs.parent_run_id }}
      DAILY_BOARD_ROLLBACK: ${{ inputs.action == 'rollback' }}
      DAILY_BOARD_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify the selected publication belongs to this trusted main workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-daily-board.mjs parent
      - name: Retrieve the trusted parent publication receipt
        if: ${{ inputs.action == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: daily-board-evidence-${{ inputs.parent_run_id }}
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: .daily-board-parent/evidence/
      - name: Select only the parent receipt
        if: ${{ inputs.action == 'publish' }}
        run: cp .daily-board-parent/evidence/receipt.json .daily-board-parent/receipt.json
      - uses: actions/checkout@v4
        if: ${{ inputs.action == 'publish' }}
        with:
          repository: braydenparker000/Missionarytube-
          ref: c28c1b2f70aabb5217b08bf31ffe4c93d0353765
          path: .jarvis-source
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact static candidate and run focused checks
        if: ${{ inputs.action == 'publish' }}
        run: |
          npm ci
          node scripts/check-jarvis-import.mjs
          node --test tests/daily-board-next.test.mjs scripts/publish-daily-board.test.mjs scripts/media-source.test.mjs
          npm run build
          DAILY_BOARD_ARTIFACT_ROOT=dist node --test tests/daily-board-browser.test.mjs
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture prepublication bytes and ETags
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-daily-board.mjs prepare
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.action == 'publish' }}
        with:
          name: daily-board-rollback-${{ github.run_id }}
          path: daily-board-publication/
          retention-days: 90
          if-no-files-found: error
      - name: Publish dependencies first, route last, and verify every public byte
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-daily-board.mjs publish
      - name: Verify the delivered Board in Chrome with isolated synthetic reads and real public reads
        if: ${{ inputs.action == 'publish' }}
        env:
          DAILY_BOARD_ORIGIN: https://missionarytube.z13.web.core.windows.net
        run: node --test tests/daily-board-browser.test.mjs
      - name: Retrieve the named rollback artifact
        if: ${{ inputs.action == 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: daily-board-rollback-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
          path: daily-board-publication/
      - name: Restore captured Board files without deleting content or assets
        if: ${{ inputs.action == 'rollback' }}
        run: node scripts/publish-daily-board.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-board-evidence-${{ github.run_id }}
          path: daily-board-publication/
          retention-days: 90
      - name: Sign out
        if: always()
        run: az logout
