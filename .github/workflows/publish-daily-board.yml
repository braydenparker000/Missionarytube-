name: Publish composable Daily Board
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [publish, rollback]
        required: true
      rollback_run_id:
        type: string
        required: false
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/checkout@v4
        if: ${{ inputs.action == 'publish' }}
        with:
          repository: braydenparker000/Missionarytube-
          ref: c28c1b2f70aabb5217b08bf31ffe4c93d0353765
          path: .jarvis-source
          fetch-depth: 0
          persist-credentials: false
      - name: Build exact static candidate and run focused checks
        if: ${{ inputs.action == 'publish' }}
        run: |
          node --test tests/daily-board-next.test.mjs scripts/publish-daily-board.test.mjs
          npm run build
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Capture prepublication bytes and ETags
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-daily-board.mjs prepare
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.action == 'publish' }}
        with:
          name: daily-board-rollback-${{ github.run_id }}
          path: daily-board-publication/
          retention-days: 90
          if-no-files-found: error
      - name: Publish dependencies first, route last, and verify every public byte
        if: ${{ inputs.action == 'publish' }}
        run: node scripts/publish-daily-board.mjs publish
      - name: Retrieve the named rollback artifact
        if: ${{ inputs.action == 'rollback' }}
        uses: actions/download-artifact@v4
        with:
          name: daily-board-rollback-${{ inputs.rollback_run_id }}
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ github.token }}
          path: daily-board-publication/
      - name: Restore only the captured route without deleting content or assets
        if: ${{ inputs.action == 'rollback' }}
        run: node scripts/publish-daily-board.mjs rollback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-board-evidence-${{ github.run_id }}
          path: daily-board-publication/
          retention-days: 90
      - name: Sign out
        if: always()
        run: az logout
