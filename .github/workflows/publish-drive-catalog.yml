name: Publish Poweramp Drive catalog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      allow_large_removal:
        description: 'Confirm that removing more than 20% of the published songs is intentional'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ vars.AZURE_DEPLOY_ENABLED == 'true' }}
    # Serialize Azure catalog publication with deployment.
    concurrency:
      group: azure-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Test authenticated publisher without credentials
        run: node --test tests/drive-publisher-auth.test.mjs
      - name: Install media preparation tool from Ubuntu packages
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version > /dev/null
      - name: Sign in using existing Azure identity
        id: azure_signin
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Reconcile, prepare, verify, and publish catalog
        env:
          GOOGLE_DRIVE_AUTH_MODE: oauth
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal == true && 'true' || 'false' }}
        run: node scripts/publish-drive-catalog.mjs
      - name: Sign out
        if: ${{ always() && steps.azure_signin.outcome == 'success' }}
        run: az logout
