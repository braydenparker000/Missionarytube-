name: Activate owner-approved Jarvis Relay once

# Temporary manual-only setup action. Remove after successful qualification.
# The enable flag stays out of normal source config so dashboard disable survives.
on:
  workflow_dispatch:
    inputs:
      confirm_activation:
        description: Enable the existing owner-only Relay connector
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  activate:
    if: ${{ inputs.confirm_activation == true && github.ref == 'refs/heads/main' && github.actor_id == '183016859' && vars.AZURE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: jarvis-worker-production
      cancel-in-progress: false
    env:
      SOURCE_COMMIT: 428dcc5f6c0b630d695c0522f46d4b9ac9235d2c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the reviewed unchanged Relay source
        uses: actions/checkout@v4
        with:
          repository: braydenparker999/jarvis
          ref: ${{ env.SOURCE_COMMIT }}
          path: .jarvis-source
          persist-credentials: false
      - name: Verify source and retain dashboard control
        run: |
          test "$(git -C .jarvis-source rev-parse HEAD)" = "$SOURCE_COMMIT"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const release=JSON.parse(readFileSync('jarvis-release.json','utf8'));
          assert.equal(release.repository,'braydenparker999/jarvis');
          assert.equal(release.commit,process.env.SOURCE_COMMIT);
          const config=JSON.parse(readFileSync('.jarvis-source/backend/wrangler.jsonc','utf8'));
          assert.equal(config.name,'jarvis-hub-api');
          assert.equal(config.keep_vars,true);
          assert.equal(Object.hasOwn(config.vars || {},'RELAY_MCP_ENABLED'),false);
          JS
      - name: Run the pinned source regression tests
        run: |
          npm --prefix .jarvis-source ci
          npm --prefix .jarvis-source test
      - name: Preserve existing Worker resource bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          node scripts/check-music-worker-bindings.mjs
          node scripts/prepare-music-worker.mjs .jarvis-source
      - name: Enable only the approved nonsecret runtime flag
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          workingDirectory: .jarvis-source
          preCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-before.json
          command: deploy --config backend/wrangler.music.generated.json --keep-vars --var RELAY_MCP_ENABLED:true
          postCommands: npx wrangler versions list --name jarvis-hub-api --json > worker-versions-after.json
      - name: Verify public discovery and authentication boundaries
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='https://jarvis-hub-api.braydenparker999.workers.dev';
          async function read(path,status,init={}) {
            const response=await fetch(origin+path,{redirect:'error',signal:AbortSignal.timeout(20000),...init});
            assert.equal(response.status,status,path);
            assert.match(response.headers.get('content-type') || '',/application\/json/);
            return response.json();
          }
          const health=await read('/health',200);assert.equal(health.ok,true);assert.equal(health.version,7);
          const protectedResource=await read('/.well-known/oauth-protected-resource/relay/mcp',200);
          assert.equal(protectedResource.resource,origin+'/relay/mcp');
          assert.deepEqual(protectedResource.authorization_servers,[origin+'/relay']);
          const oauth=await read('/.well-known/oauth-authorization-server/relay',200);
          assert.equal(oauth.issuer,origin+'/relay');
          assert.equal(oauth.authorization_endpoint,origin+'/relay/oauth/authorize');
          assert.deepEqual(oauth.code_challenge_methods_supported,['S256']);
          await read('/relay/mcp',401);
          await read('/relay/oauth/authorize',400);
          const egress=await fetch('https://jarvis-relay-egress.vercel.app/api/relay-egress',{
            method:'POST',headers:{'content-type':'application/json'},body:'{}',redirect:'error',signal:AbortSignal.timeout(20000)});
          assert.equal(egress.status,401);assert.deepEqual(await egress.json(),{error:'unauthorized'});
          console.log('Activated: health/discovery pass; MCP and egress require authentication. Owner OAuth and signed delivery still need qualification.');
          JS
      - name: Preserve nonsecret activation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-activation-${{ github.run_id }}
          path: |
            .jarvis-source/worker-versions-before.json
            .jarvis-source/worker-versions-after.json
            .jarvis-source/backend/wrangler.music.generated.json
            worker-bindings-before.json
          if-no-files-found: warn
          retention-days: 30
