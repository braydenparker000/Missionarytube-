name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-owner:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      deploy_only: ${{ steps.classify.outputs.deploy_only }}
      qualification_verified: ${{ steps.classify.outputs.qualification_verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Require exact completed producer qualification or retain full Validate
        id: classify
        run: node scripts/partition-main-qualification.mjs
  static-checks:
    needs: gate-owner
    if: ${{ always() && !cancelled() && (github.event_name != 'push' || needs.gate-owner.result != 'success' || needs.gate-owner.outputs.deploy_only != 'true' || needs.gate-owner.outputs.qualification_verified != 'true') }}
    uses: ./.github/workflows/qualify-jarvis.yml
    permissions:
      contents: read

  daily-board-import-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/checkout@v4
        with:
          repository: braydenparker000/Missionarytube-
          ref: 62ac633f367250ed21b3ecf7a4627263e9e07d9f
          path: .daily-board-import-source
          persist-credentials: false
          fetch-depth: 0
      - run: npm ci
      - name: Install the pinned Worker source dependencies
        run: npm ci
        working-directory: .daily-board-import-source
      - name: Reproduce deployed Worker and exact importer/cache candidates
        run: node scripts/publications-import-release.mjs prepare
