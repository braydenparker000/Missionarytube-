name: Daily Board reader source cutover
on:
  workflow_dispatch:
    inputs:
      action:
        description: Enable the exact destination issue or restore the legacy-only reader
        type: choice
        options: [enable, rollback]
        required: true
      issue_number:
        description: Dedicated Missionarytube- publication issue
        type: string
        required: true
        default: '250'
permissions:
  contents: read
concurrency:
  group: jarvis-worker-production
  cancel-in-progress: false
jobs:
  cutover:
    if: ${{ github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true' && vars.AZURE_STORAGE_ACCOUNT == 'missionarytube' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify issues and capture the exact Worker rollback state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          DAILY_BOARD_ACTION: ${{ inputs.action }}
          DAILY_BOARD_ISSUE: ${{ inputs.issue_number }}
        run: node scripts/daily-board-reader-cutover.mjs prepare "$DAILY_BOARD_ACTION" "$DAILY_BOARD_ISSUE"
      - name: Preserve the exact prewrite Worker bytes and checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: daily-board-reader-${{ inputs.action }}-rollback-${{ github.run_id }}
          path: |
            daily-board-reader-cutover/worker-before.js
            daily-board-reader-cutover/checkpoint.json
          retention-days: 90
          if-no-files-found: error
      - name: Apply the guarded source change and verify the public reader
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          DAILY_BOARD_ACTION: ${{ inputs.action }}
          DAILY_BOARD_ISSUE: ${{ inputs.issue_number }}
        run: node scripts/daily-board-reader-cutover.mjs apply "$DAILY_BOARD_ACTION" "$DAILY_BOARD_ISSUE"
      - name: Preserve the sanitized readback receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-board-reader-${{ inputs.action }}-receipt-${{ github.run_id }}
          path: daily-board-reader-cutover/receipt.json
          retention-days: 90
          if-no-files-found: error
